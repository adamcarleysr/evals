use_case: UC-REC-15
title: Run the day from the recruiter workbench
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-15-recruiter-workbench.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Identify the viewer and their scope
  by: worker
- n: 2
  step: Pull each section from its source
  by: worker
- n: 3
  step: Compute the attention items
  by: worker
- n: 4
  step: Render the pinned view with last-refreshed times per section
  by: worker
- n: 5
  step: Refresh each section on its cadence
  by: worker
- n: 6
  step: Answer questions and drill through within scope
  by: worker
policies:
  P1:
    rule: 'Answers give the facts only: no causes for a stall or delay, and no judgement of a candidate''s or recruiter''s
      performance.'
    protects:
    - person
    override: null
  P2:
    rule: The workbench never changes a source system. A request to act (chase, progress, book) is handed to the
      use case that owns it.
    protects:
    - data
    override: null
