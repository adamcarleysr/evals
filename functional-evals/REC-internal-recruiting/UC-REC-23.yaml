# Functional eval for UC-REC-23, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-23
title: Answer ad-hoc performance questions
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-23-answer-ad-hoc-performance-questions.md
status: draft
primary_role: Recruitment Leader
process_style: guided
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Parse the question into KPIs, entities and a period or horizon
  by: worker
- n: 2
  step: Resolve recruiters and homes, including aliases, to canonical IDs
  by: worker
- n: 3
  step: Check the scope against the asker's permissions
  by: worker
- n: 4
  step: Calculate through the governed path, using a snapshot for past periods
  by: worker
- n: 5
  step: Answer with the scope, period, definition version and any data-quality qualification
  by: worker
policies:
  P1:
    rule: Every figure comes through the governed definitions in K1 and the dashboard's calculation path. A KPI
      with no governed definition gets no figure, and missing data is reported as unavailable, never as zero.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: Answers give facts, not causes. They don't rank or label people, and don't advise on decisions about them,
      which stay with their managers.
    protects:
    - person
    - customer reputation
    override: null
