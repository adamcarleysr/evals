use_case: UC-REC-18
title: Explain week-on-week forecast change
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-18-explain-week-on-week-forecast-change.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Load the current and baseline snapshots and confirm both exist and are complete
  by: worker
- n: 2
  step: Match placements across snapshots by Placement ID
  by: worker
- n: 3
  step: Classify every difference
  by: worker
- n: 4
  step: Calculate net movement per home and week, and reconcile
  by: worker
- n: 5
  step: Write factual change lines
  by: worker
- n: 6
  step: Save the change set against the current snapshot (A3) or present it (A0)
  by: worker
policies:
  P1:
    rule: 'Change lines state only what changed: the placement, before and after. They never give a cause, and never
      attribute a movement to a person, their effort or the market.'
    protects:
    - person
    - customer reputation
    override: null
