# Functional eval for UC-REC-18, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-18
title: Explain week-on-week forecast change
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-18-explain-week-on-week-forecast-change.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Load the current and baseline snapshots and confirm both exist and are complete
  by: worker
- n: 2
  step: Match placements across snapshots by Placement ID
  by: worker
- n: 3
  step: Classify every difference
  by: worker
- n: 4
  step: Calculate net movement per home and week, and reconcile
  by: worker
- n: 5
  step: Write factual change lines
  by: worker
- n: 6
  step: Save the change set against the current snapshot (A3) or present it (A0)
  by: worker
policies:
  P1:
    rule: 'Change lines state only what changed: the placement, before and after. They never give a cause, and never
      attribute a movement to a person, their effort or the market.'
    protects:
    - person
    - customer reputation
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A0
  given:
    same_start_as: null
    state: saved snapshots for this week and last week, differing by new starters, a removal, a moved start date
      and a home change; a reference change set is stored.
    fixture: oakridge/forecast-w40-w41
    tenant_values: 'Between W40 and W41: 3 placements added at Willow Lodge, 1 removed at Beacon House, Sam Taylor''s
      Ashdown House placement moved from 27/10/2026 to 03/11/2026, and 1 placement changed home from Hazel Lodge
      to Cedar House.'
  input:
    prompt: 'Compare this week''s four-week forecast with last week''s: new, removed, moved dates, home changes,
      net by home/week.'
  variants:
  - id: PV-TERSE
    prompt: forecast changes vs last week
    context: null
    expect: same_outcome
    detail: null
  - id: PV-COLLOQUIAL
    prompt: What's shifted in the starter numbers since last Friday?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-CONTEXT
    prompt: Now do the same comparison but just for Willow Lodge
    context: after S01
    expect: same_outcome
    detail: Willow Lodge only
  - id: PV-AMBIGUOUS
    prompt: Compare the forecast with the earlier one
    context: null
    expect: clarify
    detail: which baseline snapshot
  - id: PV-FALSE-PREMISE
    prompt: Show me the two starters Ashdown House lost this week
    context: null
    expect: flag
    detail: Ashdown House had no removals; one date moved
  expected:
    state:
    - Change list = reference change set exactly (3 new, 1 removal, 1 moved date, 1 home change)
    - Each home and week net movement = W41 cell − W40 cell
    - Total net = W41 total − W40 total
    must_say:
    - '"3 new starters added to Willow Lodge" with the weeks'
    - The Sam Taylor date move with before and after
    must_not:
    - Give any reason for a change
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      stops_at: null
      note: 'Full A0 comparison: match, classify, reconcile net movement, factual lines (P1), then present.'
