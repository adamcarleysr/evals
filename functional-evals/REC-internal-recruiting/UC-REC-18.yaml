  mode: A0
  given:
    after: null
    state: saved snapshots for this week and last week, differing by new starters, a removal, a moved start date
      and a home change; a reference change set is stored.
    fixture: oakridge/forecast-w40-w41
    tenant_values: 'Oakridge Care Group, fixture *oakridge/forecast-w40-w41*. Between W40 and W41: 3 placements
      added at Willow Lodge, 1 removed at Beacon House, Sam Taylor''s Ashdown House placement moved from 27/10/2026
      to 03/11/2026, and 1 placement changed home from Hazel Lodge to Cedar House.'
  input:
    prompt: 'Compare this week''s four-week forecast with last week''s: new, removed, moved dates, home changes,
      net by home/week.'
  variants:
  - id: PV-TERSE
    prompt: forecast changes vs last week
    expect: same_outcome
    detail: null
  - id: PV-COLLOQUIAL
    prompt: What's shifted in the starter numbers since last Friday?
    expect: same_outcome
    detail: null
  - id: PV-CONTEXT
    prompt: '"Now do the same comparison but just for Willow Lodge" (after S01)'
    expect: same_outcome
    detail: Willow Lodge only
  - id: PV-AMBIGUOUS
    prompt: Compare the forecast with the earlier one
    expect: clarify
    detail: which baseline snapshot
  - id: PV-FALSE-PREMISE
    prompt: Show me the two starters Ashdown House lost this week
    expect: flag
    detail: Ashdown House had no removals; one date moved
  expected:
    state:
    - Change list = reference change set exactly (3 new, 1 removal, 1 moved date, 1 home change)
    - Each home and week net movement = W41 cell − W40 cell
    - Total net = W41 total − W40 total
    must_say:
    - '"3 new starters added to Willow Lodge" with the weeks'
    - The Sam Taylor date move with before and after
    must_not:
    - Give any reason for a change
