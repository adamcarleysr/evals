# Functional eval for UC-REC-07, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-07
title: Score a prescreen against the role rubric
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-07-score-a-prescreen-against-the-role-rubric.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Find the transcript and link it to the candidate and application
  by: worker
- n: 2
  step: Identify the rubric version
  by: worker
- n: 3
  step: Map the captured answers to each rubric item
  by: worker
- n: 4
  step: Score each item on the rubric scale with quoted evidence
  by: worker
- n: 5
  step: Apply the threshold and action rules
  by: worker
- n: 6
  step: Store the score, evidence and outcome, and read back
  by: 'A1: human · A2–A3: worker'
- n: 7
  step: Progress or route
  by: 'A3: worker for automatic advance · human otherwise'
policies:
  P1:
    rule: An item is scored only on the candidate's own words in the transcript. What the home or a team did ("the
      home dealt with this") is not the candidate's evidence. An item not asked or unclear is unknown, never scored.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: A candidate advances automatically only when the score meets the automatic-advance mark in K1 and every
      hard requirement in K2 is met. An unknown on a hard requirement, contradictory evidence or a disclosure blocks
      it.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: Only a person decides a first-stage fail. The worker may propose one, never reject the candidate.
    protects:
    - person
    - legal
    override: null
  P4:
    rule: A stored score is never changed to suit a request. The same transcript and rubric version always give
      the same score.
    protects:
    - person
    - legal
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A1
  given:
    same_start_as: null
    state: a completed voice-agent prescreen transcript for a senior support worker candidate, all sections answered.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'Sam Taylor''s Aria Stage 1 transcript for Senior Support Worker at Ashdown House on script v3.0.
      Rubric (K1): items scored 1–5; pass at an average of 3.0 or above with no 1 on a hard-fail question; automatic
      advance at 4.0 or above.'
  input:
    prompt: Score the Aria prescreen transcript for Sam Taylor applying for Senior Support Worker at Ashdown House.
      Evaluate against the role-specific rubric and threshold rules. If any answers are missing or unclear, mark
      them as unknown. Show me the score, evidence, and recommended outcome.
  variants:
  - id: PV-TERSE
    prompt: score sam's prescreen
    context: null
    expect: same_outcome
    detail: null
  - id: PV-CONTEXT
    prompt: Now score that call against the rubric
    context: after S01 of UC-REC-06
    expect: same_outcome
    detail: null
  - id: PV-AMBIGUOUS
    prompt: Score the latest candidate's prescreen
    context: two calls finished at the same time
    expect: clarify
    detail: which candidate
  - id: PV-FALSE-PREMISE
    prompt: Score Sam's Stage 2 interview
    context: only Stage 1 has happened
    expect: flag
    detail: no Stage 2 transcript; offer Stage 1
  expected:
    state:
    - Nothing written
    must_say:
    - Rubric version, per-item scores with quoted evidence, average, and the recommended outcome with the rule applied
    must_not:
    - Use anything not in the transcript
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      stops_at: 6
      note: 'A1: score, evidence and recommended outcome shown; nothing written.'
