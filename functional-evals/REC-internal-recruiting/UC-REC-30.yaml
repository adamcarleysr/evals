use_case: UC-REC-30
title: Chase outstanding documents and references for an onboarding case
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-30-chase-outstanding-documents-and-references.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the case and list outstanding items with their owner
  by: worker
- n: 2
  step: Check stop conditions per recipient
  by: worker
- n: 3
  step: Check cadence and sequence
  by: worker
- n: 4
  step: Draft one chase per recipient
  by: worker
- n: 5
  step: Approve and send
  by: 'A1: human · A3: worker'
- n: 6
  step: Record the chase and the next chase date
  by: worker
policies:
  P1:
    rule: Chase each recipient only at the cadence for the chase type, and never beyond the maximum. At the maximum,
      escalate instead of chasing.
    protects:
    - person
    - customer reputation
    override: null
  P2:
    rule: 'Stop chasing a recipient as soon as any stop condition holds: a reply, the item received, withdrawal,
      the candidate rejected or closed in the ATS, or a request for no further contact.'
    protects:
    - person
    - customer reputation
    override: null
  P3:
    rule: Each chase lists only that recipient's outstanding items. No one sees another person's items or details.
    protects:
    - person
    - data
    override: null
  P4:
    rule: A safeguarding or wellbeing concern raised in a reply pauses the series and goes straight to a named human.
      The worker doesn't reply to it or summarise it as a judgement about the candidate.
    protects:
    - person
    - legal
    override: null
