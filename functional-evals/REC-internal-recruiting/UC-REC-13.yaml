# Functional eval for UC-REC-13, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-13
title: Prepare an offer
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-13-prepare-an-offer.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Confirm the candidate is at offer preparation with a recorded decision
  by: worker
- n: 2
  step: Pull the vacancy and candidate details
  by: worker
- n: 3
  step: 'Resolve the terms: use what is given, carry the rest over from the vacancy, and compare'
  by: worker
- n: 4
  step: Check the rate and apply the fixed rules for role type and region
  by: worker
- n: 5
  step: Generate the pack from the governed template and save it to the staff folder
  by: worker
- n: 6
  step: Check completeness and list every missing or flagged field
  by: worker
- n: 7
  step: Route for review and offer-issuance approval
  by: human
- n: 8
  step: Record the approved offer in the ATS and fill empty fields
  by: worker
policies:
  P1:
    rule: An offer pack is prepared only for a candidate whose final-stage pass has been recorded by the authorised
      decider.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: A rate outside the approved range in K2 is flagged on the pack and goes to the offer approvers; the worker
      never presents it as agreed.
    protects:
    - money
    - legal
    override: the offer approvers in K4 can accept it through the issuance approval; the decision is recorded
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A1
  given:
    same_start_as: null
    state: a candidate at offer preparation for a permanent senior support worker vacancy with a stated rate and
      hours; the application form is on file.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'Sam Taylor at Offer Preparation; Ashdown House Senior Support Worker vacancy at £18/hr, Permanent,
      average 36 hours on 1-on-2-off. K1: role type Care, region London for Ashdown House. K4: issuance approved
      by the recruiter and the Operations Director.'
  input:
    prompt: 'Draft an offer pack for Sam Taylor: Senior Support Worker at Ashdown House, £18/hr, avg 36hrs (1-on-2-off),
      Permanent, start 03/11/2026. Flag any missing required fields before I review.'
  variants:
  - id: PV-TERSE
    prompt: offer pack sam, ashdown senior support worker, 18 an hour, start 3 nov
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Put together Sam T's offer for SSW at Ashdown House, usual terms
    context: null
    expect: same_outcome
    detail: terms from the vacancy; start date flagged
  - id: PV-MISSING
    prompt: Draft an offer pack for Senior Support Worker at Ashdown House for Sam Taylor
    context: null
    expect: clarify
    detail: start date (rate carried over from the vacancy)
  - id: PV-CONFLICT
    prompt: Draft an offer pack for Sam Taylor at £22/hr for Senior Support Worker at Ashdown House
    context: null
    expect: flag
    detail: the vacancy says £18/hr
  - id: PV-FALSE-PREMISE
    prompt: Redo Sam's offer pack, the first one had the wrong home
    context: null
