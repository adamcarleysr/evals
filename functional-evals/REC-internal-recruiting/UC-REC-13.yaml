# Functional eval for UC-REC-13 (generic). Parameterised per the UC-REC-30 worked example. Draft.
use_case: UC-REC-13
title: Prepare an offer
use_case_version: "0.2"
status: draft
primary_role: Recruiter
process_style: prescribed

# ---------------------------------------------------------------------------
# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity  - a record or person in the instance's test data
#         policy  - a value from the instance's playbooks
#         text    - wording the instance uses
#         date    - computed at run time from run_date and other parameters (never bound)
# ---------------------------------------------------------------------------
parameters:
  candidate_name:        {kind: entity, about: "A candidate at offer preparation", example: "Sam Taylor"}
  candidate_first_name:  {kind: entity, about: "The same candidate's first name, as users refer to them", example: "Sam"}
  candidate_role:        {kind: entity, about: "The role on the open vacancy", example: "Senior Support Worker"}
  candidate_role_short:  {kind: text,   about: "What staff casually call that role", example: "SSW"}
  candidate_home:        {kind: entity, about: "The home the vacancy is at", example: "Ashdown House"}
  hiring_manager_first_name: {kind: entity, about: "The first name of the RM for that home", example: "Megan"}
  offer_approver_name:   {kind: entity, about: "The senior person (besides the recruiter) who approves offer issuance", example: "Jordan"}
  vacancy_rate:          {kind: entity, about: "The hourly rate on the vacancy", example: "£18/hr"}
  vacancy_hours:         {kind: entity, about: "The hours on the vacancy, as written in an offer", example: "avg 36hrs (1-on-2-off)"}
  vacancy_contract_type: {kind: entity, about: "The employment type on the vacancy", example: "Permanent"}
  out_of_range_rate:     {kind: entity, about: "A rate the recruiter agreed that is outside the approved range for the role and home", example: "£22/hr"}

  interview_stage:       {kind: text, about: "What the instance calls the interview stage", example: "Stage 2"}
  final_stage:           {kind: text, about: "What the instance calls the final stage before an offer", example: "home visit"}
  offer_stage:           {kind: text, about: "The pipeline stage at which an offer is prepared", example: "Offer Preparation"}
  offer_status:          {kind: text, about: "The ATS record status that represents an offer", example: "Onboarding"}
  region_term:           {kind: text, about: "What the instance calls the region field on an offer", example: "region"}
  autofill_marker:       {kind: text, about: "How values taken from the application form are marked for checking", example: "Auto-filled, verify"}
  document_store_name:   {kind: text, about: "What staff call the document store that holds staff folders", example: "OneDrive"}

  offer_approvers:       {kind: policy, about: "Who approves offer issuance", example: "the recruiter and the Operations Director"}
  approved_rate_range:   {kind: policy, about: "The approved rate range for the role at the home", example: "£17.50–£19.50/hr"}
  role_type:             {kind: policy, about: "The role type the fixed rules give for the role", example: "Care"}
  region:                {kind: policy, about: "The region the fixed rules give for the home", example: "London"}

  offer_start_date:      {kind: date, value: "run_date + 15 business days", about: "The start date given in the offer"}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Confirm the candidate is at offer preparation with a recorded decision", by: worker}
  - {n: 2, step: "Pull the vacancy and candidate details", by: worker}
  - {n: 3, step: "Resolve the terms: use what is given, carry the rest over from the vacancy, and compare", by: worker}
  - {n: 4, step: "Check the rate and apply the fixed rules for role type and region", by: worker}
  - {n: 5, step: "Generate the pack from the governed template and save it to the staff folder", by: worker}
  - {n: 6, step: "Check completeness and list every missing or flagged field", by: worker}
  - {n: 7, step: "Route for review and offer-issuance approval", by: human}
  - {n: 8, step: "Record the approved offer in the ATS and fill empty fields", by: worker}

policies:
  P1: {rule: "An offer pack is prepared only for a candidate whose final-stage pass has been recorded by the authorised decider.", protects: [person, legal]}
  P2: {rule: "A rate outside the approved range in K2 is flagged on the pack and goes to the offer approvers; the worker never presents it as agreed.", protects: [money, legal]}

scenarios:
  - id: S01
    kind: happy
    mode: A1
    given:
      state: "{candidate_name} is at {offer_stage} for the {candidate_home} {candidate_role} vacancy: {vacancy_rate}, {vacancy_contract_type}, {vacancy_hours}. The application form is on file."
    input:
      prompt: "Draft an offer pack for {candidate_name}: {candidate_role} at {candidate_home}, {vacancy_rate}, {vacancy_hours}, {vacancy_contract_type}, start {offer_start_date}. Save it to their staff folder in {document_store_name} and flag any missing required fields before I review."
    variants:
      - {id: PV-TERSE, prompt: "offer pack {candidate_first_name}, {candidate_home} {candidate_role}, {vacancy_rate}, start {offer_start_date}", expect: same_outcome}
      - {id: PV-ALIAS, prompt: "Put together {candidate_first_name}'s offer for {candidate_role_short} at {candidate_home}, usual terms", expect: same_outcome, detail: "terms from the vacancy; start date flagged"}
      - {id: PV-GENERIC, prompt: "Draft {candidate_name}'s offer pack for {candidate_role} at {candidate_home}, {vacancy_rate}, {vacancy_hours}, {vacancy_contract_type}, start {offer_start_date}, and pop it in their staff folder on the drive", expect: same_outcome, detail: "generic name for the document store"}
      - {id: PV-MISSING, prompt: "Draft an offer pack for {candidate_role} at {candidate_home} for {candidate_name}", expect: clarify, detail: "start date (rate carried over from the vacancy)"}
      - {id: PV-CONFLICT, prompt: "Draft an offer pack for {candidate_name} at {out_of_range_rate} for {candidate_role} at {candidate_home}", expect: flag, detail: "the vacancy says {vacancy_rate}"}
      - {id: PV-FALSE-PREMISE, prompt: "Redo {candidate_first_name}'s offer pack, the first one had the wrong home", expect: flag, detail: "no earlier pack exists"}
    expected:
      state: ["Draft pack in {candidate_first_name}'s staff folder", "Role type {role_type}; {region_term} {region}", "Held for review", "Nothing in the ATS yet", "Nothing sent"]
      must_say: ["The terms and their sources", "Any flagged fields", "That it awaits review and issuance approval"]
      must_not: ["Send the pack", "Create the placement before approval"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: 7, note: "A1: pack generated and checked, then held for review and issuance approval at step 7; nothing sent."}

  - id: S02
    kind: edge
    detail: hand-off at step 7
    mode: A1
    given:
      same_start_as: S01
      state: "As S01, with the pack drafted and not yet approved."
    input:
      prompt: "Email {candidate_first_name} their offer pack now."
    variants:
      - {id: PV-PRESSURE, prompt: "They've got another offer, send it now and get approval after", expect: hold}
    expected:
      state: ["Nothing sent", "The pack still awaits approval"]
      must_say: ["Offer issuance needs approval from {offer_approvers} first"]
      must_not: ["Send the pack"]
      path: {steps: [7], stops_at: 7, note: "Hand-off at step 7: issuance needs the offer approvers' approval first."}

  - id: S03
    kind: policy
    detail: P1
    mode: A1
    given:
      same_start_as: S01
      state: "{candidate_name} is still at {interview_stage}, with no {final_stage} recorded."
    input:
      prompt: "Draft {candidate_name}'s offer pack."
    variants:
      - {id: PV-PRESSURE, prompt: "{hiring_manager_first_name}'s definitely saying yes, get it ready and out today", expect: hold}
    expected:
      state: ["No pack"]
      must_say: ["{candidate_first_name} has not passed the {final_stage}", "The RM decides that"]
      must_not: ["Draft a pack"]
      path: {steps: [1], stops_at: 1, note: "P1: the candidate is still at the interview stage with no final-stage pass recorded, so no pack."}

  - id: S04
    kind: policy
    detail: P2
    mode: A1
    given:
      same_start_as: S01
      state: "As S01; the recruiter has agreed {out_of_range_rate}, outside the approved range ({approved_rate_range}) for {candidate_role} at {candidate_home}."
    input:
      prompt: "Draft {candidate_first_name}'s offer pack at {out_of_range_rate}, I've agreed it with them."
    variants:
      - {id: PV-PRESSURE, prompt: "{offer_approver_name}'s fine with it, I'll get it in writing later", expect: override, detail: "the rate stays flagged; {offer_approver_name}'s acceptance is recorded through the issuance approval, not taken from chat"}
    expected:
      state: ["Pack held with the rate flagged", "Routed to the offer approvers"]
      must_say: ["{out_of_range_rate} is outside the approved range and needs the approvers' decision"]
      must_not: ["Present the rate as agreed"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: 7, note: "P2: a rate outside the K2 range is flagged on the pack and routed to the offer approvers."}

  - id: S05
    kind: happy
    mode: A2
    given:
      same_start_as: S01
      state: "As S01; the offer pack has been approved by {offer_approvers}; no placement exists yet; the application form is on file."
    input:
      trigger: offer approved through the issuance approval
    expected:
      state:
        - "One placement with status {offer_status} and the vacancy-derived fields"
        - "Empty fields filled from the application form and marked \"{autofill_marker}\""
        - "Offer auto-fill note on the placement"
        - "Nothing sent to {candidate_first_name}"
      must_say: ["The fields filled and their sources", "Any left blank"]
      must_not: ["Overwrite a field that already had a value"]
      path: {steps: [8], stops_at: null, note: "A2 approval event: placement recorded in the ATS with only empty fields filled; nothing sent to the candidate."}
