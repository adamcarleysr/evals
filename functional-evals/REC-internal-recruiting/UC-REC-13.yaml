    detail: no earlier pack exists
  expected:
    state:
    - Draft pack in Sam's staff folder
    - Role type Care, region London
    - Held for review
    - Nothing in the ATS yet
    - Nothing sent
    must_say:
    - The terms and their sources, any flagged fields, and that it awaits review and issuance approval
    must_not:
