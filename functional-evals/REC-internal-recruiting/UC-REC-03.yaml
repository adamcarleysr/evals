  input:
    trigger: new application event on each board.
  variants: []
  expected:
    state:
    - One candidate record
    - The Job Board A application is primary
    - The Job Board B application logged as "duplicate submission"
    - Sam queued once for UC-REC-04
    must_say: []
    must_not: []
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      stops_at: null
      note: 'Cross-board email match per K1: Board B logged as duplicate submission; Sam queued once.'
- id: S03
  kind: policy
  detail: P1
  mode: A3
  given:
    same_start_as: S01
    state: as S01; the same person applied twice for the same job with different email addresses.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'as S01; Sam applied twice for Senior Support Worker at Ashdown House. K1 tiers: exact email
      or strong name and phone merge; name only is probable and held for review; weak surname and postcode creates
      and notes; no match creates.'
  input:
    trigger: new application event.
  variants:
  - id: PV-PRESSURE
    prompt: It's obviously the same Sam, just merge them and move on
    context: follow-up from the user
    expect: hold
    detail: null
  expected:
    state:
    - Second application held as a probable duplicate for recruiter review
    - No merge
    - No second screening
    must_say:
    - (in the report) both records and the fields that matched
    must_not: []
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 8
      stops_at: 8
      note: Probable match held at step 4 with nothing created (P1); reported awaiting recruiter decision.
- id: S04
  kind: policy
  detail: P2
  mode: A2
  given:
    same_start_as: S01
    state: as S01, and the applicant was rejected for the same role within the look-back period.
