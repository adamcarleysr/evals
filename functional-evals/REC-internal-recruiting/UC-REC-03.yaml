  expected:
    state:
    - Sam appears once, linked to his existing record, flagged as recently rejected
    must_say: []
    must_not:
    - Reject or skip him automatically
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      stops_at: null
      note: 'Unclear: ''show'' request but expected state implies ingest; recent rejection flagged at step 6, not
