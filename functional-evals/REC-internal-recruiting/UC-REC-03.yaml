  kind: happy
  detail: null
  mode: A3
  given:
    same_start_as: S01
    state: as S01; the same applicant then applies for the same job on a second board with the same email address.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'as S01; Sam applies via Job Board B an hour later. K1: cross-board duplicates match by email,
