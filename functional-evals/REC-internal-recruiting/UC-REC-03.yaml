# Functional eval for UC-REC-03, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-03
title: Ingest and de-duplicate applicants
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-03-ingest-and-de-duplicate-applicants.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: List the open jobs
  by: worker
- n: 2
  step: Pull new applications from each board since the last successful pull
  by: worker
- n: 3
  step: Link each application to its ATS job
  by: worker
- n: 4
  step: Match the applicant against existing candidates
  by: worker
- n: 5
  step: Apply the tier action
  by: worker
- n: 6
  step: Flag recent rejections
  by: worker
- n: 7
  step: Read back every write
  by: worker
- n: 8
  step: Report and hand on
  by: worker
policies:
  P1:
    rule: Applicants are merged only on a tier that K1 says merges. A probable match is held for the recruiter with
      both records shown, and nothing is created or merged until they decide.
    protects:
    - person
    - data
    override: null
  P2:
    rule: A recent rejection for the same role is flagged for the recruiter. It never causes the applicant to be
      rejected or skipped automatically.
    protects:
    - person
    - legal
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A2
  given:
    same_start_as: null
    state: three boards connected; three new applications on one board for different open jobs, none from an existing
      candidate.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: ', with Job Boards A to C. Sam Taylor applied for Senior Support Worker at Ashdown House via
      Job Board A today and has no ATS record; two other new Job Board A applicants for other open jobs.'
  input:
    prompt: Pull new applicants from Job Board A for all active ATS vacancies. Deduplicate against existing candidates,
      link each application to the correct vacancy, and tell me how many new applicants were ingested and for which
      roles.
  variants:
  - id: PV-TERSE
    prompt: pull board A applicants
    context: null
    expect: same_outcome
    detail: null
  - id: PV-COLLOQUIAL
    prompt: Anything new come in on Job Board A? Get it into the ATS
    context: null
    expect: same_outcome
    detail: null
  - id: PV-MISSING
    prompt: Pull the new applicants into the ATS
    context: no board or job named; several boards connected
    expect: clarify
    detail: which boards, or all
  - id: PV-FALSE-PREMISE
    prompt: Pull new Job Board A applicants for the Ashdown House Deputy Manager job
    context: no such open job
    expect: flag
    detail: no open Deputy Manager job at Ashdown House
  expected:
    state:
    - Three new candidates with applications on their jobs
    - Sam on the Ashdown House Senior Support Worker job
    - All read back
    - Audit entries
    must_say:
    - Three ingested, broken down by job
    - None skipped or flagged
    must_not:
    - Include closed jobs
    - Report other boards as checked
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      stops_at: null
      note: 'Full ingest of Board A: three new candidates created, read back and reported by job.'
