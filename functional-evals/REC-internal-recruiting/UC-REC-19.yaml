# Functional eval for UC-REC-19, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-19
title: Detect and route data-quality issues
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-19-detect-and-route-data-quality-issues.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Retrieve the run's source data and confirm every query succeeded and returned the source total
  by: worker
- n: 2
  step: Run the record-level checks
  by: worker
- n: 3
  step: Run the run-level checks
  by: worker
- n: 4
  step: Map each issue to the metrics it affects and decide block, qualify or flag
  by: worker
- n: 5
  step: Add or update a queue item for each issue, keyed by rule and record, and assign the owner
  by: worker (A2 only)
- n: 6
  step: Read back each queue item and mark recurring patterns
  by: worker (A2 only)
- n: 7
  step: Notify each owner of their newly assigned items
  by: worker (A2 only)
policies:
  P1:
    rule: Every check reports passed, failed (with the records) or not run; a check that couldn't run is never reported
      as passed. A metric whose impact is unclear is blocked rather than qualified, and a blocked or qualified metric
      is never presented as clean.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: Queue items are never dismissed or deleted. An item closes only as Resolved, with the run that cleared
      it, once its issue no longer appears in the source.
    protects:
    - data
    override: null
