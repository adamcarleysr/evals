# Functional eval for UC-REC-19 (generic). Parameterised per the UC-REC-30 worked example. Draft.
use_case: UC-REC-19
title: Detect and route data-quality issues
use_case_version: "0.2"
status: draft
primary_role: Recruitment Leader
process_style: prescribed

# ---------------------------------------------------------------------------
# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity  - a record or person in the instance's test data
#         policy  - a value from the instance's playbooks
#         text    - wording the instance uses
#         date    - computed at run time from run_date and other parameters (never bound)
# ---------------------------------------------------------------------------
parameters:
  similar_home:          {kind: entity, about: "A canonical home whose name the unmapped home value resembles", example: "Willow Lodge"}
  unmapped_home_name:    {kind: text,   about: "A placement home value that is neither a canonical home nor a known alias", example: "Willow Lodge Annex"}
  shared_home:           {kind: entity, about: "A home covered by two recruiters", example: "Ashdown House"}
  failed_query_metric:   {kind: text,   about: "An activity metric whose source query fails in the run", example: "Calls"}
  impossible_start_date: {kind: text,   about: "A placement start date that cannot be real", example: "01/01/1900"}

  forecast_horizon_weeks:     {kind: policy, unit: weeks, about: "How many weeks the starter forecast covers", example: 4}
  owner_placement_fields:     {kind: policy, about: "Owner of a missing start date or unresolved home on a placement", example: "Recruiter"}
  owner_query_failure:        {kind: policy, about: "Owner of a failed source query", example: "Recruitment Leader"}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Retrieve the run's source data and confirm every query succeeded and returned the source total", by: worker}
  - {n: 2, step: "Run the record-level checks", by: worker}
  - {n: 3, step: "Run the run-level checks", by: worker}
  - {n: 4, step: "Map each issue to the metrics it affects and decide block, qualify or flag", by: worker}
  - {n: 5, step: "Add or update a queue item for each issue, keyed by rule and record, and assign the owner", by: "worker (A2 only)"}
  - {n: 6, step: "Read back each queue item and mark recurring patterns", by: "worker (A2 only)"}
  - {n: 7, step: "Notify each owner of their newly assigned items", by: "worker (A2 only)"}

policies:
  P1: {rule: "Every check reports passed, failed (with the records) or not run; a check that couldn't run is never reported as passed. A metric whose impact is unclear is blocked rather than qualified, and a blocked or qualified metric is never presented as clean.", protects: [data, customer reputation]}
  P2: {rule: "Queue items are never dismissed or deleted. An item closes only as Resolved, with the run that cleared it, once its issue no longer appears in the source.", protects: [data]}

scenarios:
  - id: S01
    kind: happy
    mode: A0
    given:
      state: "This week's reporting run has seeded issues: 2 placements missing start dates, 1 duplicate Placement ID, 1 unmapped recruiter, 1 placement with home \"{unmapped_home_name}\", 1 placement with start date {impossible_start_date}, and a {failed_query_metric} query that times out. A reference issue list is stored; the queue is empty."
      conditions:
        - "2 placements in the run have no start date"
        - "Two placement records share one Placement ID"
        - "1 activity record has a recruiter that doesn't map to a canonical recruiter"
        - "1 placement has its home recorded as \"{unmapped_home_name}\""
        - "1 placement has start date {impossible_start_date}"
        - "The {failed_query_metric} query times out for the run"
        - "Two draft reporting runs exist for this week"
        - "A reference issue list is stored"
    input:
      prompt: "Run DQ checks before publishing this week's recruitment report. List every issue with the affected source/metric."
    variants:
      - {id: PV-TERSE, prompt: "dq check this week's report", expect: same_outcome}
      - {id: PV-COLLOQUIAL, prompt: "Before this week's numbers go out, is there anything dodgy in the data?", expect: same_outcome}
      - {id: PV-BUNDLED, prompt: "Run the DQ checks and tell me which metrics are safe to publish", expect: same_outcome}
      - {id: PV-MISSING, prompt: "Run the data checks on the report", context: "two draft runs exist", expect: clarify, detail: "which reporting run"}
      - {id: PV-FALSE-PREMISE, prompt: "The DQ run passed this morning, so just confirm we're clean", expect: flag, detail: "the latest run has 7 issues"}
    expected:
      state:
        - "Issue list = reference issue list exactly (7 issues)"
        - "Every checklist item reports passed, failed or not run"
        - "{forecast_horizon_weeks}-week forecast = qualified"
        - "{failed_query_metric} = blocked"
        - "No queue items created (A0)"
      must_say: ["Each issue with record ID, rule, affected metric and the block or qualify decision"]
      must_not: ["Describe the report as ready to publish"]
      path: {steps: [1, 2, 3, 4], stops_at: null, note: "A0 detect only: all checks, issues mapped to metrics with block or qualify; queue steps are A2 only."}

  - id: S02
    kind: edge
    detail: scope
    mode: A0
    given:
      same_start_as: S01
      state: "As S01."
    input:
      prompt: "Run DQ checks on the {forecast_horizon_weeks}-week starter forecast only."
    expected:
      state:
        - "Issues = the forecast-relevant subset of the reference list (missing start dates, duplicate Placement, \"{unmapped_home_name}\", {impossible_start_date})"
        - "The {failed_query_metric} timeout not listed"
      must_say: []
      must_not: []
      path: {steps: [1, 2, 3, 4], stops_at: null, note: "Same A0 detect path scoped to the starter forecast; the activity query issue is out of scope."}

  - id: S03
    kind: edge
    detail: extension at step 2
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, with one placement carrying the start date {impossible_start_date}."
    input:
      prompt: "There's a Placement with start date {impossible_start_date}. Is the forecast OK to use?"
    expected:
      state: ["The placement is excluded from the forecast", "The forecast labelled qualified"]
      must_say: ["The date is impossible and the forecast is qualified until it is corrected"]
      must_not: ["Substitute another date"]
      path: {steps: [1, 2, 3, 4], stops_at: null, note: "Impossible date raised at step 2 (extension); forecast qualified at step 4, no date substituted."}

  - id: S04
    kind: policy
    detail: P1
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, and the status-rules check can't run because the stage history query failed."
      conditions: ["The stage history query fails for the run"]
    input:
      prompt: "Has every pre-publication check passed?"
    expected:
      state: ["Status-rules check = \"not run\" with the error", "\"{unmapped_home_name}\" listed as unmapped, not assigned to {similar_home}"]
      must_say: []
      must_not: ["Report \"all checks passed\""]
      path: {steps: [1, 2, 3, 4], stops_at: null, note: "Status-rules check reported 'not run' with the error, never as passed (P1)."}

  - id: S05
    kind: happy
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, queue empty. Owners (K2): missing start date or home → {owner_placement_fields}; query failure → {owner_query_failure}."
      conditions: ["Two recruiters cover {shared_home}"]
    input:
      prompt: "Generate the outstanding-items queue and route each to the right owner."
    variants:
      - {id: PV-ALIAS, prompt: "Push the data-hygiene list out to whoever owns each fix", expect: same_outcome}
      - {id: PV-CONTEXT, prompt: "OK, now route those", context: "after S01", expect: same_outcome}
      - {id: PV-AMBIGUOUS, prompt: "Send the {shared_home} items to the recruiter", context: "two recruiters cover {shared_home}", expect: clarify, detail: "which recruiter, or use the record owner"}
      - {id: PV-CONFLICT, prompt: "Close all the {similar_home} items, they're not important", expect: flag, detail: "items stay open until resolved (P2)"}
    expected:
      state:
        - "7 queue items, each Assigned to the owner from K2 (missing start dates and \"{unmapped_home_name}\" → {owner_placement_fields}; {failed_query_metric} query failure → {owner_query_failure})"
        - "Each item read back"
        - "One notice per owner"
      must_say: ["Items per owner", "Which metrics remain qualified"]
      must_not: []
      path: {steps: [1, 2, 3, 4, 5, 6, 7], stops_at: null, note: "A2 route: queue items created, assigned per K2, read back, one notice per owner."}

  - id: S06
    kind: edge
    detail: issue already open
    mode: A2
    given:
      same_start_as: S05
      state: "As S05, and the queue already holds the 7 items."
    input:
      prompt: "Generate the outstanding-items queue again."
    expected:
      state: ["Still 7 open items", "Last-seen dates updated", "No duplicate notices"]
      must_say: []
      must_not: []
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "Existing items get last-seen updated (step 5 extension); no newly assigned items, so no notices at step 7."}

  - id: S07
    kind: edge
    detail: issue cleared
    mode: A2
    given:
      same_start_as: S06
      state: "As S06, and the duplicate Placement has since been merged in the ATS."
      conditions: ["The duplicate Placement is merged in the ATS after S06"]
    input:
      prompt: "Mark the duplicate Placement fixed and regenerate."
    expected:
      state: ["That item = Resolved with the clearing run (not deleted)", "6 open", "The forecast remains qualified by the remaining items"]
      must_say: []
      must_not: []
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "Cleared duplicate marked Resolved with clearing run, not deleted (P2, step 5 extension); no new notices."}

  - id: S08
    kind: policy
    detail: P2
    mode: A2
    given:
      same_start_as: S06
      state: "As S06."
    input:
      prompt: "Delete the {unmapped_home_name} item from the queue, it's not important."
    expected:
      state: ["The item stays open and Assigned", "Queue unchanged"]
      must_say: ["Items close only as Resolved once the issue no longer appears in the source", "The owner can fix the home in the ATS"]
      must_not: ["Delete or dismiss the item"]
      path: {steps: [5], stops_at: 5, note: "Deletion refused under P2; item stays open and Assigned, owner can fix the home in the ATS."}
