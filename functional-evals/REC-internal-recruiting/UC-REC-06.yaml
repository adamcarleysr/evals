# Functional eval for UC-REC-06, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-06
title: Run a telephone prescreen
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-06-run-a-telephone-prescreen.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Confirm the candidate, job, eligibility and script version
  by: worker
- n: 2
  step: Call and confirm identity
  by: worker
- n: 3
  step: Run the script sections in order
  by: worker
- n: 4
  step: Handle any disclosure
  by: worker
- n: 5
  step: Retry calls that fail
  by: worker
- n: 6
  step: Capture the transcript, outcome and end-of-call checklist
  by: worker
- n: 7
  step: Score the answers
  by: worker
- n: 8
  step: Prepare or write the ATS updates and read them back
  by: 'A1: human approves · A3: worker'
policies:
  P1:
    rule: A safeguarding, DBS or conduct disclosure on the call is recorded as facts and routed at once to the reviewer
      in K3, and stops automatic progression. The voice agent thanks the candidate and makes no suitability judgement,
      on the call or in the note.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: An autonomous prescreen runs only for a candidate who meets the role's screening threshold, on a role
      eligible for it (K2). Anyone else goes to the recruiter.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: Only a person decides a first-stage fail. The worker may propose one, never reject the candidate.
    protects:
    - person
    - legal
    override: null
  P4:
    rule: No prescreen question is asked until the person on the call has confirmed they are the candidate. Any
      doubt ends the call politely and goes to the recruiter.
    protects:
    - person
    - data
    override: null
  P5:
    rule: Call a candidate only within the retry cadence and maximum in K4. At the maximum, hand over to the recruiter.
    protects:
    - person
    - customer reputation
    override: null
