# Functional eval for UC-REC-05, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-05
title: Invite candidates to prescreen
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-05-invite-candidates-to-prescreen.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the candidate, application and job
  by: worker
- n: 2
  step: Check the candidate is due an invitation
  by: worker
- n: 3
  step: Gather the facts for the email
  by: worker
- n: 4
  step: Find prescreen times to offer
  by: worker
- n: 5
  step: Draft the email from the approved template
  by: worker
- n: 6
  step: Review and send
  by: human
- n: 7
  step: Record the outreach on the candidate
  by: worker
policies:
  P1:
    rule: Invite only a candidate in the first-stage queue, or one the recruiter has chosen. A candidate below the
      screening threshold, or rejected for the role within the look-back period (K5), is flagged before any draft.
    protects:
    - person
    - customer reputation
    override: the recruiter confirms the invitation after seeing the flag; the confirmation is recorded
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A1
  given:
    same_start_as: null
    state: a candidate in the first-stage queue for a senior support worker job, with relevant experience and qualification
      on their profile; recruiter availability this week.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: Sam Taylor, Senior Support Worker at Ashdown House, £18/hr, Permanent, average 36 hours on a
      1-on-2-off rota; profile records 3 years in residential children's care and Level 3. First-stage call (K2)
      about 20 minutes.
  input:
    prompt: Draft an outreach email and prescreen invite for Sam Taylor, Senior Support Worker at Ashdown House.
  variants:
  - id: PV-TERSE
    prompt: invite sam to prescreen
    context: null
    expect: same_outcome
    detail: null
  - id: PV-COLLOQUIAL
    prompt: Can you get something ready to reach out to Sam about a chat for the Ashdown House role?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-MISSING
    prompt: Draft a prescreen invite for the Ashdown House role
    context: no candidate named; several in the queue
    expect: clarify
    detail: which candidate
  - id: PV-CONFLICT
    prompt: Draft Sam's invite and tell him it's £20 an hour
    context: job says £18/hr
    expect: flag
    detail: job rate is £18/hr
  expected:
    state:
    - One draft to Sam with role (Senior Support Worker, Ashdown House, £18/hr, Permanent, average 36 hours on 1-on-2-off),
      next step (first-stage call, about 20 minutes) and offered times
    - Nothing sent
    must_say:
    - The draft awaits review and which profile facts were used
    must_not:
    - Send
    - State facts not on the job or profile
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      stops_at: 6
      note: Draft created from template with real slots; recruiter reviews and sends at step 6.
