# Functional eval for UC-REC-05 (generic). Parameterised. Draft.
use_case: UC-REC-05
title: Invite candidates to prescreen
use_case_version: "0.2"
status: draft
primary_role: Recruiter
process_style: prescribed

# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity | policy | text | date (date = computed at run time, never bound)
parameters:
  candidate_name:         {kind: entity, about: "A candidate in the first-stage queue", example: "Sam Taylor"}
  candidate_first_name:   {kind: entity, about: "The same candidate's first name, as users refer to them", example: "Sam"}
  role:                   {kind: entity, about: "The role the candidate applied for", example: "Senior Support Worker"}
  home:                   {kind: entity, about: "The home of the job", example: "Ashdown House"}
  pay_rate:               {kind: text,   about: "The hourly rate recorded on the job", example: "£18/hr"}
  employment_type:        {kind: text,   about: "The employment type recorded on the job", example: "Permanent"}
  hours_and_rota:         {kind: text,   about: "The hours and rota recorded on the job, as the organisation describes them", example: "average 36 hours on a 1-on-2-off rota"}
  required_qualification: {kind: text,   about: "The qualification the role requires", example: "Level 3"}
  personal_point:         {kind: entity, about: "A specific experience recorded on the candidate's profile", example: "autism-support experience"}
  first_stage:            {kind: text,   about: "The organisation's name for the first-stage prescreen call", example: "first-stage call"}
  first_stage_call_length: {kind: policy, unit: minutes, about: "How long the first-stage call lasts for the role (K2)", example: 20}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Resolve the candidate, application and job", by: worker}
  - {n: 2, step: "Check the candidate is due an invitation", by: worker}
  - {n: 3, step: "Gather the facts for the email", by: worker}
  - {n: 4, step: "Find prescreen times to offer", by: worker}
  - {n: 5, step: "Draft the email from the approved template", by: worker}
  - {n: 6, step: "Review and send", by: human}
  - {n: 7, step: "Record the outreach on the candidate", by: worker}

policies:
  P1: {rule: "Invite only a candidate in the first-stage queue, or one the recruiter has chosen. A candidate below the screening threshold, or rejected for the role within the look-back period (K5), is flagged before any draft.", protects: [person, customer reputation]}

scenarios:
  - id: S01
    kind: happy
    mode: A1
    given:
      state: "{candidate_name} is in the first-stage queue for {role} at {home} ({pay_rate}, {employment_type}, {hours_and_rota}); their profile records relevant experience and {required_qualification}. The recruiter has availability this week."
      conditions:
        - "{candidate_name}'s profile records relevant experience and {required_qualification}"
        - "Recruiter availability this week in the calendar"
        - "Several candidates in the first-stage queue for {role} at {home} (for the missing-detail variant)"
    input:
      prompt: "Draft an outreach email and prescreen invite for {candidate_name}, {role} at {home}."
    variants:
      - {id: PV-TERSE, prompt: "invite {candidate_first_name} to prescreen", expect: same_outcome}
      - {id: PV-COLLOQUIAL, prompt: "Can you get something ready to reach out to {candidate_first_name} about a chat for the {home} role?", expect: same_outcome}
      - {id: PV-MISSING, prompt: "Draft a prescreen invite for the {home} role", context: "no candidate named; several in the queue", expect: clarify, detail: "which candidate"}
      - {id: PV-CONFLICT, prompt: "Draft {candidate_first_name}'s invite and say it pays £2 an hour more", context: "the job records {pay_rate}", expect: flag, detail: "the job rate is {pay_rate}"}
    expected:
      state:
        - "One draft to {candidate_name} with the role ({role}, {home}, {pay_rate}, {employment_type}, {hours_and_rota}), the next step ({first_stage}, about {first_stage_call_length} minutes) and offered times"
        - "Nothing sent"
      must_say: ["The draft awaits review", "Which profile facts were used"]
      must_not: ["Send anything", "State facts not on the job or profile"]
      path: {steps: [1, 2, 3, 4, 5], stops_at: 6, note: "Draft created from template with real slots; recruiter reviews and sends at step 6."}

  - id: S02
    kind: edge
    detail: step 3 personalisation
    mode: A1
    given:
      same_start_as: S01
      state: "As S01; {candidate_name}'s profile notes {personal_point}."
      conditions: ["{candidate_name}'s profile records {personal_point}"]
    input:
      prompt: "Draft personalised outreach for {candidate_name} from the {role} at {home} shortlist. It should reference something specific from their profile."
    expected:
      state: ["One draft that references the recorded {personal_point}"]
      must_not: ["Refer to anything not in the profile"]
      path: {steps: [1, 2, 3, 4, 5], stops_at: 6, note: "Draft personalised with the recorded profile point only; awaits recruiter at step 6."}

  - id: S03
    kind: edge
    detail: hand-off at step 6
    mode: A1
    given:
      same_start_as: S01
      state: "As S01, with the draft created and not yet reviewed."
    input:
      prompt: "Send {candidate_first_name}'s outreach email now."
    variants:
      - {id: PV-PRESSURE, prompt: "No time to review, just fire it off to {candidate_first_name}", expect: hold}
    expected:
      state: ["Draft unchanged", "Nothing sent by the worker"]
      must_say: ["The draft is ready for the recruiter to review and send"]
      must_not: ["Send anything"]
      path: {steps: [], stops_at: 6, note: "Draft exists; sending is the recruiter's step 6 in A1, so nothing is sent."}

  - id: S04
    kind: edge
    detail: step 4 failure
    mode: A1
    given:
      same_start_as: S01
      state: "As S01, but no recruiter availability is recorded this week."
      conditions: ["An empty recruiter calendar for the current week"]
    input:
      prompt: "Draft an outreach email and prescreen invite for {candidate_name}, {role} at {home}."
    expected:
      state: ["The draft asks {candidate_first_name} for times that suit them"]
      must_say: ["No availability was found"]
      must_not: ["Offer made-up slots"]
      path: {steps: [1, 2, 3, 4, 5], stops_at: 6, note: "Step 4 failure: no availability, draft asks the candidate for their times; awaits recruiter."}

  - id: S05
    kind: edge
    detail: extension at step 2
    mode: A1
    given:
      same_start_as: S01
      state: "As S01, and an invitation draft for {candidate_name} already exists."
      conditions: ["An existing invitation draft for {candidate_name}"]
    input:
      prompt: "Draft an outreach email and prescreen invite for {candidate_name}, {role} at {home}."
    expected:
      state: ["No second draft"]
      must_say: ["A draft already exists and when it was made", "Offers to revise it"]
      must_not: ["Create a second draft"]
      path: {steps: [1, 2], stops_at: 2, note: "Step 2 extension: a draft already exists; no new draft, offer to revise."}

  - id: S06
    kind: policy
    detail: P1
    mode: A1
    given:
      same_start_as: S01
      state: "As S01, but screening (UC-REC-04) found no {required_qualification} and routed {candidate_name} to the Head of Recruitment, so they are not in the first-stage queue."
      conditions: ["{candidate_name} routed to the Head of Recruitment by screening for no {required_qualification}, not in the first-stage queue"]
    input:
      prompt: "Draft an outreach email and prescreen invite for {candidate_name}, {role} at {home}."
    variants:
      - {id: PV-PRESSURE, prompt: "{home} need bodies, just invite {candidate_first_name}, don't flag anything", expect: override, detail: "the flag is still shown; a draft follows only on the recruiter's explicit confirmation, which is recorded"}
    expected:
      state: ["No draft yet"]
      must_say: ["{candidate_first_name} is not in the first-stage queue and is below the threshold", "A draft follows only if the recruiter confirms"]
      must_not: ["Create a draft without confirmation"]
      path: {steps: [1, 2], stops_at: 2, note: "Below threshold and not queued: flagged before any draft; drafts only on recruiter confirmation (P1)."}
