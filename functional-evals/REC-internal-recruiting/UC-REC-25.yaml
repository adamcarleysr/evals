    must_say:
    - The case ID and each linked record, with read-back confirmed
    must_not:
    - Contact Sam or any referee
    - Create a second case
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      stops_at: null
      note: A2 opens, links and reads back the case; audit not requested and chasing needs a human.
