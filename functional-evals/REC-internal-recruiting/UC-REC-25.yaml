# Functional eval for UC-REC-25, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-25
title: Open an onboarding compliance case from the Placement handoff
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-25-open-an-onboarding-compliance-case.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the Placement and check for an existing case
  by: worker
- n: 2
  step: Resolve the matching staff-file folder
  by: worker
- n: 3
  step: Open the case and link the records
  by: worker
- n: 4
  step: Read back the case and every link
  by: worker
- n: 5
  step: Audit the evidence on file against the checklist
  by: 'A2: on request · A3: worker'
- n: 6
  step: Build the outstanding-items list
  by: worker
- n: 7
  step: Hand the gaps to chasing and set the next action
  by: 'A2: human · A3: worker'
policies:
  P1:
    rule: A staff-file folder is linked only when it matches this Placement under K4, never on the candidate's name
      alone. If none or several match, the case opens with the folder unlinked and no evidence is audited.
    protects:
    - person
    - legal
    - data
    override: null
  P2:
    rule: Ofsted readiness is measured only against the start date on the Placement or handoff. With no start date,
      readiness timing is unavailable; it is never estimated from a target or expected date.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: A checklist item's status comes only from the evidence in the staff file. A check the handoff reports
      as pre-completed is recorded as reported and still verified against the evidence ⚠ verify.
    protects:
    - person
    - legal
    override: null
scenarios:
