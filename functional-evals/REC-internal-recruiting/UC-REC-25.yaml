  mode: A2
  given:
    same_start_as: null
    state: a Placement for a senior support worker in onboarding status, with a start date; one matching staff folder;
      no existing case; a second candidate exists for the same role and home.
    fixture: oakridge/sam-taylor-ashdown
    tenant_values: Sam Taylor, Senior Support Worker at Ashdown House, start 03/11/2026; one staff folder for Sam
      Taylor.
  input:
    prompt: Onboarding started for Sam Taylor's Placement, Senior Support Worker at Ashdown House. Set up his onboarding
      case.
  variants:
  - id: PV-TERSE
    prompt: open sam taylor's onboarding case
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Spin up the compliance file for Sam T, Senior Support Worker at Ashdown House
    context: null
    expect: same_outcome
    detail: null
  - id: PV-AMBIGUOUS
    prompt: Set up the onboarding case for the Ashdown House Senior Support Worker
    context: null
    expect: clarify
    detail: which candidate
  - id: PV-FALSE-PREMISE
    prompt: Sam's Willow Lodge Placement has started onboarding, set up his case
    context: null
    expect: flag
    detail: his Placement is at Ashdown House; offer to open that case
  expected:
    state:
    - One case with links to the Placement, candidate, role, Ashdown House, contact details, onboarding fields and
      staff folder
    - Stage evidence collection
