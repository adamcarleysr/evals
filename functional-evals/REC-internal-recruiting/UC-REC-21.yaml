  expected:
    state:
    - By 15:55 all checks pass
    - At 16:00 version 2026-W41-v1 sent once to each governed recipient
    - Audit entry with version hash, timestamp, recipients and delivery status
    must_say: []
    must_not: []
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      stops_at: null
