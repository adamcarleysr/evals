    must_not:
    - Create the job
    - Assume Permanent
    path:
      steps:
      - 1
      - 2
      - 3
      stops_at: 3
      note: Draft brief, employment type asked for; brief awaits approval so nothing is written (P1).
- id: S03
  kind: policy
  detail: P1
  mode: A1
  given:
    same_start_as: S01
    state: as S01; the request comes from someone who signs with a first name only, gives no figures and asks for
