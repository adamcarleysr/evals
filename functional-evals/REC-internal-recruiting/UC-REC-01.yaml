# Functional eval for UC-REC-01, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-01
title: Open a vacancy from a manager request
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-01-open-a-vacancy-from-a-manager-request.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Read the request and extract the brief fields
  by: worker
- n: 2
  step: Resolve home, role and hiring manager to canonical values
  by: worker
- n: 3
  step: Ask only for the missing mandatory fields
  by: worker
- n: 4
  step: Approve the brief
  by: human
- n: 5
  step: Check for an existing open job for the same home and role
  by: worker
- n: 6
  step: Create or update the job with the approved values
  by: 'A1: human · A2: worker'
- n: 7
  step: Read the job back and compare field by field
  by: worker
policies:
  P1:
    rule: A job is created or changed only from a brief a person has approved, with every mandatory field in K1
      given in the request or confirmed by a person. Nothing is carried over from an earlier vacancy, such as "same
      pay as before", without confirmation.
    protects:
    - money
    - customer reputation
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A2
  given:
    same_start_as: null
    state: no open senior support worker job exists for the home; the request gives every mandatory field.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: No open Senior Support Worker job at Ashdown House; hiring manager Megan Hart; £18/hr, Permanent,
      headcount 1, reason replacement, target start 03/11/2026.
  input:
    prompt: 'Create an ATS job: Senior Support Worker at Ashdown House, hiring manager Megan Hart, £18/hr, Permanent,
      headcount 1, reason replacement, target start 03/11/2026.'
  variants:
  - id: PV-TERSE
    prompt: new ATS job, senior support worker ashdown, Megan Hart, £18 perm, 1 head, replacement, start 3/11
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Open a Senior RSW role at OCG Ashdown House for Megan, £18 an hour, perm, one person, replacing a leaver,
      from 3 Nov
    context: null
    expect: same_outcome
    detail: alias resolves to Senior Support Worker at Ashdown House
  - id: PV-MISSING
    prompt: 'Create an ATS job: Senior Support Worker at Ashdown House, £18/hr, Permanent, start 03/11/2026.'
    context: null
    expect: clarify
    detail: hiring manager, headcount and reason only
  - id: PV-FALSE-PREMISE
    prompt: Update the Senior Support Worker job at Ashdown House we opened last week to start 03/11/2026
    context: null
    expect: flag
    detail: no open Senior Support Worker job at Ashdown House; offer to create one
  expected:
    state:
    - One new Senior Support Worker job at Ashdown House holding the given values
    - Read-back matches
    - Audit entry written
    must_say:
    - The job ID, each saved value, and that vacancy reason has no ATS field if that is the case
    must_not:
    - Ask for fields already given
    - Create a second job
    path:
      steps:
      - 1
      - 2
      - 4
      - 5
      - 6
      - 7
      stops_at: null
      note: Nothing missing so step 3 skipped; explicit instruction serves as brief approval; A2 worker writes and
        reads back.
