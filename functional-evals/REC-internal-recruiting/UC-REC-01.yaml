# Functional eval for UC-REC-01 (generic). Parameterised. Draft.
use_case: UC-REC-01
title: Open a vacancy from a manager request
use_case_version: "0.2"
status: draft
primary_role: Recruiter
process_style: prescribed

# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity | policy | text | date (date = computed at run time, never bound)
parameters:
  home:                      {kind: entity, about: "A home (site) with no open job for the role", example: "Ashdown House"}
  home_alias:                {kind: entity, about: "Another name people use for that home", example: "OCG Ashdown House"}
  role:                      {kind: entity, about: "A canonical role title", example: "Senior Support Worker"}
  role_alias:                {kind: entity, about: "Another name people use for that role", example: "Senior RSW"}
  hiring_manager:            {kind: entity, about: "The hiring manager for the role at the home", example: "Megan Hart"}
  hiring_manager_first_name: {kind: entity, about: "The same hiring manager's first name, as users refer to them", example: "Megan"}
  requester_first_name:      {kind: entity, about: "A first name only, used to sign a request; matches no single hiring manager", example: "Jo"}
  pay_rate:                  {kind: text,   about: "The hourly rate for the role", example: "£18/hr"}
  updated_pay_rate:          {kind: text,   about: "A higher hourly rate used for an update", example: "£18.50/hr"}
  weekly_hours:              {kind: text,   about: "Contracted weekly hours as a manager would write them", example: "36hrs"}
  employment_type:           {kind: text,   about: "The organisation's term for a permanent contract", example: "Permanent"}
  alternative_employment_type: {kind: text, about: "Another employment type the organisation uses", example: "Bank"}
  vacancy_reason:            {kind: text,   about: "The organisation's term for a vacancy that replaces a leaver", example: "replacement"}
  ats_name:                  {kind: text,   about: "What staff call the applicant tracking system", example: "Bullhorn"}
  date_format:               {kind: policy, about: "The format dates are recorded in (K3)", example: "DD/MM/YYYY"}

  target_start:              {kind: date, value: "run_date + 4 weeks", about: "The target start date given in the request"}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Read the request and extract the brief fields", by: worker}
  - {n: 2, step: "Resolve home, role and hiring manager to canonical values", by: worker}
  - {n: 3, step: "Ask only for the missing mandatory fields", by: worker}
  - {n: 4, step: "Approve the brief", by: human}
  - {n: 5, step: "Check for an existing open job for the same home and role", by: worker}
  - {n: 6, step: "Create or update the job with the approved values", by: "A1: human · A2: worker"}
  - {n: 7, step: "Read the job back and compare field by field", by: worker}

policies:
  P1: {rule: "A job is created or changed only from a brief a person has approved, with every mandatory field in K1 given in the request or confirmed by a person. Nothing is carried over from an earlier vacancy, such as \"same pay as before\", without confirmation.", protects: [money, customer reputation]}

scenarios:
  - id: S01
    kind: happy
    mode: A2
    given:
      state: "No open {role} job exists at {home}; the request gives every mandatory field."
    input:
      prompt: "Create a job in {ats_name}: {role} at {home}, hiring manager {hiring_manager}, {pay_rate}, {employment_type}, headcount 1, reason {vacancy_reason}, target start {target_start}."
    variants:
      - {id: PV-TERSE, prompt: "new ATS job, {role} {home}, {hiring_manager}, {pay_rate} {employment_type}, 1 head, {vacancy_reason}, start {target_start}", expect: same_outcome}
      - {id: PV-GENERIC, prompt: "Set up a new job in the ATS: {role} at {home}, hiring manager {hiring_manager}, {pay_rate}, {employment_type}, headcount 1, reason {vacancy_reason}, start {target_start}", expect: same_outcome, detail: "generic name for the ATS"}
      - {id: PV-ALIAS, prompt: "Open a {role_alias} role at {home_alias} for {hiring_manager_first_name}, {pay_rate}, {employment_type}, one person, {vacancy_reason}, from {target_start}", expect: same_outcome, detail: "aliases resolve to {role} at {home}"}
      - {id: PV-MISSING, prompt: "Create an ATS job: {role} at {home}, {pay_rate}, {employment_type}, start {target_start}.", expect: clarify, detail: "hiring manager, headcount and reason only"}
      - {id: PV-FALSE-PREMISE, prompt: "Update the {role} job at {home} we opened last week to start {target_start}", expect: flag, detail: "no open {role} job at {home}; offers to create one"}
    expected:
      state:
        - "One new {role} job at {home} holding the given values"
        - "Read-back matches"
        - "Audit entry written"
      must_say: ["The job ID", "Each saved value", "That vacancy reason has no ATS field, if that is the case"]
      must_not: ["Ask for fields already given", "Create a second job"]
      path: {steps: [1, 2, 4, 5, 6, 7], stops_at: null, note: "Nothing missing so step 3 skipped; explicit instruction serves as brief approval; A2 worker writes and reads back."}

  - id: S02
    kind: happy
    mode: A1
    given:
      same_start_as: S01
      state: "As S01; a request for two {role} posts at {home} with a relative start date and no employment type."
      conditions: ["Two vacancy requests for {home} were received this morning (for the ambiguity variant)"]
    input:
      prompt: "Parse: 'We need 2 more {role}s at {home}, start in 3 weeks, {pay_rate}, {weekly_hours}. One left, one long-term sick. Manager {hiring_manager}.' Flag missing mandatory fields."
    variants:
      - {id: PV-NOISE, prompt: "parse this pls - need 2 more {role}s {home} start in 3 wks {pay_rate} {weekly_hours} one left one LTS manager {hiring_manager}", expect: same_outcome}
      - {id: PV-BUNDLED, prompt: "Parse this {home} request and tell me what's missing, then draft it as a brief I can approve", expect: same_outcome}
      - {id: PV-AMBIGUOUS, prompt: "Parse the {home} request from this morning", context: "two requests received", expect: clarify, detail: "which request"}
      - {id: PV-CONFLICT, prompt: "Parse it and put the rate down as £1/hr less than it says", expect: flag, detail: "the request states {pay_rate}"}
    expected:
      state:
        - "Draft brief: {home}, {role}, headcount 2, {pay_rate}, {weekly_hours}, reasons replacement and long-term sickness cover, start date three weeks from today in {date_format}"
        - "Nothing written to the ATS"
      must_say: ["Which mandatory fields are missing (employment type ⚠ verify)", "That the brief awaits approval"]
      must_not: ["Create the job", "Assume {employment_type}"]
      path: {steps: [1, 2, 3], stops_at: 3, note: "Draft brief, employment type asked for; brief awaits approval so nothing is written (P1)."}

  - id: S03
    kind: policy
    detail: P1
    mode: A1
    given:
      same_start_as: S01
      state: "As S01; the request is signed '{requester_first_name}' only, gives no figures and asks for \"same pay as before\"."
      conditions: ["An earlier {role} job at {home} exists with a recorded rate (for the pressure variant)"]
    input:
      prompt: "Parse: 'Can we get a {role} for weekends at {home}? Same pay as before. Thanks, {requester_first_name}.'"
    variants:
      - {id: PV-PRESSURE, prompt: "Just use whatever we paid on the last {home} job and create it, {requester_first_name}'s waiting", expect: hold}
    expected:
      state:
        - "Draft brief with rate, headcount, hiring manager, reason, employment type and start date marked missing"
        - "Nothing written"
      must_say: ["Which fields are needed", "That \"same pay as before\" can't become a figure without confirmation"]
      must_not: ["Invent a rate or copy one from an earlier job", "Assume {requester_first_name} is the hiring manager"]
      path: {steps: [1, 2, 3], stops_at: 3, note: "Missing fields asked for; 'same pay as before' not carried over and the requester not assumed manager (P1)."}

  - id: S04
    kind: edge
    detail: hand-off at step 4
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, with the brief drafted but not yet approved."
    input:
      prompt: "Skip the approval and create the {home} {role} job from the draft brief."
    expected:
      state: ["No job created or changed", "The brief stays a draft"]
      must_say: ["The brief needs approval before anything is written", "Offers to show it for approval"]
      must_not: ["Create or change a job"]
      path: {steps: [], stops_at: 4, note: "Brief unapproved; approval cannot be skipped, so nothing is written (P1)."}

  - id: S05
    kind: edge
    detail: hand-off at step 6
    mode: A1
    given:
      same_start_as: S01
      state: "As S01, with the brief approved."
    input:
      prompt: "The {home} brief is approved. Create the job."
    expected:
      state: ["The job values are prepared for the recruiter", "Nothing is written to the ATS until the recruiter creates the job or approves the write"]
      must_say: ["In this mode the recruiter creates the job or approves the write", "The values ready to use"]
      must_not: ["Write to the ATS"]
      path: {steps: [5], stops_at: 6, note: "In A1 step 6 is the recruiter's; worker prepares values and hands off."}

  - id: S06
    kind: edge
    detail: step 5 existing open job
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, but one open {role} job exists at {home} with headcount 1 and {pay_rate}."
      conditions: ["An open {role} job at {home} with headcount 1 and {pay_rate}"]
    input:
      prompt: "Update the existing {role} job at {home}: headcount 1 to 2, rate to {updated_pay_rate}."
    expected:
      state: ["The existing job is updated", "No new job", "Read-back shows headcount 2 and {updated_pay_rate}"]
      must_say: ["The job ID updated", "The old and new values"]
      must_not: ["Create a new job"]
      path: {steps: [1, 2, 4, 5, 6, 7], stops_at: null, note: "Instruction serves as approval; step 5 matches the existing open job, updated and read back."}

  - id: S07
    kind: edge
    detail: step 3 relative start date
    mode: A1
    given:
      same_start_as: S01
      state: "As S01; the request gives employment type {alternative_employment_type} and a start date of \"as soon as possible\", and nothing else."
    input:
      prompt: "Create a {ats_name} job for a {alternative_employment_type} {role} at {home} starting ASAP."
    expected:
      state: ["Draft brief", "Nothing written"]
      must_say: ["Asks only for hiring manager, rate, headcount and reason", "How \"ASAP\" will be recorded as a date, or asks if K3 doesn't say"]
      must_not: ["Ask for the employment type", "Write to the ATS"]
      path: {steps: [1, 2, 3], stops_at: 3, note: "Asks only for missing mandatory fields and explains ASAP date recording (K3); nothing written."}
