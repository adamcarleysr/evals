    prompt: parse this pls - need 2 more senoir support wrkers ashdown start in 3 wks 18ph 36hrs one left one LTS
      manager [Ashdown House RM]
    context: null
    expect: same_outcome
    detail: null
  - id: PV-BUNDLED
    prompt: Parse this Ashdown House request and tell me what's missing, then draft it as a brief I can approve
