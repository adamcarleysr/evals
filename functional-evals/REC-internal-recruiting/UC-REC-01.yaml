  kind: happy
  detail: null
  mode: A1
  given:
    same_start_as: S01
    state: as S01; a request for two senior support workers at the home with a relative start date and no employment
      type.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: as S01; the request text is the one quoted in the prompt.
  input:
    prompt: 'Parse: ''We need 2 more Senior Support Workers at Ashdown House, start in 3 weeks, £18/hr, 36hrs. One
      left, one long-term sick. Manager [Ashdown House RM].'' Flag missing mandatory fields.'
  variants:
