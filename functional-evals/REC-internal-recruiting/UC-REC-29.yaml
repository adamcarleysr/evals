# Functional eval for UC-REC-29, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-29
title: Advance the onboarding stage when a milestone is met
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-29-advance-the-onboarding-stage.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the case and its current stage
  by: worker
- n: 2
  step: Check the milestone against the progression rule
  by: worker
- n: 3
  step: Gate the moves that need a person's decision
  by: human
- n: 4
  step: Reconcile the checklist and staff-file evidence with the target stage
  by: worker
- n: 5
  step: Write the stage
  by: worker
- n: 6
  step: Read back and log the progression
  by: worker
policies:
  P1:
    rule: A move that needs a person's decision in K1 happens only on that person's recorded approval. Nobody is
      shown as Started until the start date is reached and their arrival is confirmed.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: A stage moves only when its criteria in K1 are met by validated evidence, and never skips a stage.
    protects:
    - person
    - legal
    override: null
