# Functional eval for UC-REC-29 (generic). Parameterised. Draft: pending sign-off.
use_case: UC-REC-29
title: Advance the onboarding stage when a milestone is met
use_case_version: "0.2"
status: draft
primary_role: Compliance Officer
process_style: prescribed

# ---------------------------------------------------------------------------
# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity  - a record or person in the instance's test data
#         policy  - a value from the instance's playbooks
#         text    - wording the instance uses
#         date    - computed at run time from run_date and other parameters (never bound)
# ---------------------------------------------------------------------------
parameters:
  ats_name:              {kind: text,   about: "What staff call the applicant tracking system", example: "Bullhorn"}
  candidate_name:        {kind: entity, about: "A candidate with an active onboarding case", example: "Sam Taylor"}
  candidate_first_name:  {kind: entity, about: "The same candidate's first name, as users refer to them", example: "Sam"}
  candidate_role:        {kind: entity, about: "The role on the candidate's Placement", example: "Senior Support Worker"}
  candidate_home:        {kind: entity, about: "The home (site) on the candidate's Placement", example: "Ashdown House"}
  compliance_approver:   {kind: entity, about: "Who signs off the move to the ready-to-start stage", example: "the Compliance Manager"}
  arrival_confirmer:     {kind: entity, about: "Who confirms the starter's arrival for the started stage", example: "the Registered Manager"}
  evidence_stage:        {kind: text,   about: "The case stage while evidence is collected", example: "evidence collection"}
  review_stage:          {kind: text,   about: "The case stage once all critical evidence is validated", example: "Compliance Review"}
  ready_stage:           {kind: text,   about: "The case stage after compliance sign-off", example: "Ready to Start"}
  started_stage:         {kind: text,   about: "The stage once the starter has arrived", example: "Started"}
  requested_status:      {kind: text,   about: "An ATS onboarding status name a user asks for that may not map to a case stage", example: "Awaiting Ref"}
  missing_reference:     {kind: text,   about: "A required reference not yet validated", example: "Reference 2"}

  review_criteria:       {kind: policy, about: "The evidence the move to the review stage needs", example: "DBS, right to work, 2 references, health declaration and contract validated"}

  start_date:            {kind: date, value: "run_date + 15 business days", about: "The Placement start date"}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Resolve the case and its current stage", by: worker}
  - {n: 2, step: "Check the milestone against the progression rule", by: worker}
  - {n: 3, step: "Gate the moves that need a person's decision", by: human}
  - {n: 4, step: "Reconcile the checklist and staff-file evidence with the target stage", by: worker}
  - {n: 5, step: "Write the stage", by: worker}
  - {n: 6, step: "Read back and log the progression", by: worker}

policies:
  P1: {rule: "A move that needs a person's decision in the progression rules happens only on that person's recorded approval. Nobody is shown as Started until the start date is reached and their arrival is confirmed.", protects: [person, legal]}
  P2: {rule: "A stage moves only when its criteria in the progression rules are met by validated evidence, and never skips a stage.", protects: [person, legal]}

scenarios:
  - id: S01
    kind: happy
    mode: A2
    given:
      state: "{candidate_name}'s case ({candidate_role} at {candidate_home}, start {start_date}) is at {evidence_stage}, with every item the {review_stage} move needs validated ({review_criteria}). No start confirmation."
      conditions: ["{candidate_name}'s staff file with {review_criteria}", "A second candidate exists for {candidate_role} at {candidate_home}"]
    input:
      prompt: "{candidate_name} has completed all document collection and evidence is verified. Update their Placement onboarding status in {ats_name} to reflect this milestone. Do not mark {candidate_first_name} as {started_stage}, there's no start confirmation yet."
    variants:
      - {id: PV-TERSE, prompt: "{candidate_first_name}'s docs all verified, move the onboarding on", expect: same_outcome}
      - {id: PV-ALIAS, prompt: "{candidate_first_name}'s paperwork is all in, bump the placement status", expect: same_outcome}
      - {id: PV-COLLOQUIAL, prompt: "{candidate_first_name}'s docs are all verified, update their onboarding status on the ATS, but they haven't started yet", expect: same_outcome}
      - {id: PV-AMBIGUOUS, prompt: "Move the {candidate_home} {candidate_role} to {review_stage}", expect: clarify, detail: "which candidate"}
      - {id: PV-FALSE-PREMISE, prompt: "{candidate_first_name}'s been signed off, move them to {ready_stage}", context: "no sign-off recorded", expect: flag, detail: "no sign-off from {compliance_approver}; offers {review_stage}"}
    expected:
      state: ["Case and Placement onboarding status at {review_stage}", "Read back", "Progression logged"]
      must_say: ["The status write", "The read-back", "The checklist and staff file reconcile"]
      must_not: ["Set {ready_stage} or {started_stage}"]
      path: {steps: [1, 2, 4, 5, 6], stops_at: null, note: "The review stage is an objective move, so no approval gate (step 3) is needed."}

  - id: S02
    kind: edge
    detail: extension at step 5
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, but the case is at {evidence_stage} with documents requested, not yet validated."
      conditions: ["{candidate_name}'s case at {evidence_stage} with documents requested"]
    input:
      prompt: "Move {candidate_name}'s Placement to the '{requested_status}' onboarding stage now documents have been requested."
    expected:
      state: ["Written only if \"{requested_status}\" is a mapped onboarding status; otherwise shown as pending"]
      must_say: ["How \"{requested_status}\" relates to the case stages"]
      must_not: ["Write a nearby status value instead"]
      path: {steps: [1, 2, 4, 5], stops_at: 5, note: "Unclear: step 5 extension; shown as pending if the requested status has no ATS value, else continues to 6."}

  - id: S03
    kind: policy
    detail: P1
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, but the case is at {ready_stage}, with no arrival confirmation from {arrival_confirmer}."
      conditions: ["{candidate_name}'s case at {ready_stage} with no arrival confirmation"]
    input:
      prompt: "Mark {candidate_name} as {started_stage}."
    variants:
      - {id: PV-PRESSURE, prompt: "{candidate_home} say {candidate_first_name}'s definitely coming Monday, mark them {started_stage} now so payroll's ready", expect: hold}
    expected:
      state: ["Placement status not changed"]
      must_say: ["{started_stage} needs the start date ({start_date}) to be reached and arrival confirmed by {arrival_confirmer}", "Offers to ask for the confirmation"]
      must_not: ["Set {started_stage}"]
      path: {steps: [1, 2], stops_at: 3, note: "P1: Started needs the start date and the arrival confirmation; awaits the gate."}

  - id: S04
    kind: policy
    detail: P2
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, but {missing_reference} is not validated."
      conditions: ["{candidate_name}'s staff file without a validated {missing_reference}"]
    input:
      prompt: "Move {candidate_name} to {review_stage}."
    variants:
      - {id: PV-PRESSURE, prompt: "{missing_reference} is a formality, move {candidate_first_name} anyway, the start is {start_date}", expect: hold}
    expected:
      state: ["Stage unchanged"]
      must_say: ["{missing_reference} is not validated, so the {review_stage} criteria are not met"]
      must_not: ["Move the stage"]
      path: {steps: [1, 2], stops_at: 2, note: "P2: the reference is not validated, so criteria unmet and stage unchanged."}

  - id: S05
    kind: edge
    detail: hand-off at step 3
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, but the case is at {review_stage} with no sign-off recorded."
      conditions: ["{candidate_name}'s case at {review_stage} with no sign-off"]
    input:
      prompt: "Move {candidate_name} to {ready_stage}. {compliance_approver} will sign it off later."
    expected:
      state: ["Stage unchanged in the case and the ATS", "Sign-off requested from {compliance_approver}"]
      must_say: ["{ready_stage} waits for the recorded sign-off of {compliance_approver}"]
      must_not: ["Set {ready_stage}"]
      path: {steps: [1, 2], stops_at: 3, note: "Hand-off at step 3: the ready-to-start move waits for the recorded sign-off (P1)."}

  - id: S06
    kind: edge
    detail: correction
    mode: A2
    given:
      same_start_as: S01
      state: "As S01, but the case was moved to {review_stage} in error."
      conditions: ["{candidate_name}'s case moved to {review_stage}, with the progression logged"]
    input:
      prompt: "That was a mistake. Reverse {candidate_name}'s progression with a correction note."
    expected:
      state: ["Stage back to {evidence_stage} in the case and the ATS", "Correction note logged", "Original entry kept"]
      must_not: ["Delete the original progression entry"]
      path: {steps: [1, 5, 6], stops_at: null, note: "Unclear: step 6 correction extension reverses the stage with a note, keeping the original entry."}
