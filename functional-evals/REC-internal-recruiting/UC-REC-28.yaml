# Functional eval for UC-REC-28, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-28
title: Keep the ATS compliance record in sync with the evidence
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-28-keep-the-ats-compliance-record-in-sync.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the target records, Placement ID first
  by: worker
- n: 2
  step: Confirm the evidence behind each change
  by: worker
- n: 3
  step: Map each change to its ATS field
  by: worker
- n: 4
  step: Write each field not already synced
  by: worker
- n: 5
  step: Read back and compare
  by: worker
- n: 6
  step: Report the reconciliation
  by: worker
policies:
  P1:
    rule: A compliance field is written only when validated evidence in the staff file, or a status recorded by
      the compliance team, supports it. An item without evidence is reported as missing, never marked complete.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: The worker never writes final compliance approval. When every item is present, the case is marked "ready
      for sign-off" and approval stays with the Compliance Manager.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: Each item is written only to its mapped field in K1. An unmapped item is shown as pending or failed, never
      written to a nearby field.
    protects:
    - data
    override: null
scenarios:
