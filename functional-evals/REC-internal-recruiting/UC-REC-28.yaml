    detail: the certificate number and the evidence
  - id: PV-CONFLICT
    prompt: Put the disclosure reference in the DBS certificate number field
    context: null
    expect: flag
    detail: the certificate number is required
  expected:
    state:
    - Three fields written and read back as matching
    - Each write logged in the sync history
