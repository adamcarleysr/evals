# Functional eval for UC-REC-26, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-26
title: Classify and validate compliance evidence in a staff file
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-26-classify-and-validate-compliance-evidence.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Find the new documents and match the folder to the active case
  by: worker
- n: 2
  step: Open each document
  by: worker
- n: 3
  step: Classify by content
  by: worker
- n: 4
  step: Extract objective dates and identifiers
  by: worker
- n: 5
  step: Validate against the type rules
  by: worker
- n: 6
  step: Update the checklist item
  by: 'A1: human · A3: worker'
- n: 7
  step: Hand on to filing and sync; recalculate outstanding items
  by: worker
policies:
  P1:
    rule: A document is classified by what it contains. The filename is a hint only ⚠ verify, and a document whose
      type is uncertain is "unclassified" and goes to the compliance team.
    protects:
    - person
    - legal
    - data
    override: null
  P2:
    rule: Only a document that passes the validity rules for its type moves a checklist item forward. Unreadable,
      expired, conflicting or uncertain evidence goes to human review and is never marked compliant.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: A document that raises a safeguarding concern or a criminal disclosure goes at once to the named reviewer
      in K3. The worker records no automated outcome and does not summarise it as a judgement about the candidate.
    protects:
    - person
    - legal
    override: null
  P4:
    rule: Final compliance approval stays with a person. The worker may propose the move to Compliance Review, never
      approve the starter.
    protects:
    - person
    - legal
    override: null
