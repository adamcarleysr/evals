# Functional eval for UC-REC-10, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-10
title: Collect hiring-manager decisions
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-10-collect-hiring-manager-decisions.md
status: draft
primary_role: Hiring Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the manager and the homes in their scope
  by: worker
- n: 2
  step: Gather every pending decision for those homes, with time in queue
  by: worker
- n: 3
  step: Pre-load the evidence for each decision type
  by: worker
- n: 4
  step: Present the queue, oldest first
  by: worker
- n: 5
  step: Record the manager's decision
  by: human
- n: 6
  step: Write the decision to the case and the ATS
  by: worker
- n: 7
  step: Trigger the configured next step
  by: worker
- n: 8
  step: Remind, then escalate, on the configured cadence
  by: worker
policies:
  P1:
    rule: Only the hiring manager records a decision. The worker never records one itself or on a manager's behalf,
      however likely the outcome seems.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: A decision is accepted only from the RM or a deputy for the candidate's home, and only as one of the options
      for that decision type in K1.
    protects:
    - person
    - legal
    override: null
