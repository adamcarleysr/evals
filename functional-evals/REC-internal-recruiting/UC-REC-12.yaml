      2 interview for Senior Support Worker at Ashdown House; Megan Hart (RM) recorded Progress; stage advanced
      to Stage 3 (Home Visit).
  input:
    prompt: Draft a progression email for Sam Taylor who passed his interview for Senior Support Worker at Ashdown
      House, with onboarding next steps. Keep it as a draft for my review.
  variants:
