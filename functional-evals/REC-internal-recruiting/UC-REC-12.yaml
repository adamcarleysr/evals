# Functional eval for UC-REC-12, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-12
title: Communicate a candidate outcome
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-12-communicate-a-candidate-outcome.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the candidate, vacancy and recorded outcome
  by: worker
- n: 2
  step: Select the template for the outcome and stage
  by: worker
- n: 3
  step: 'Assemble the content: next steps for a progression; feedback for a rejection'
  by: worker
- n: 4
  step: Check the content against the governed tone and remove off-tone or personal remarks
  by: worker
- n: 5
  step: Draft the email
  by: worker
- n: 6
  step: Approve and send
  by: human
- n: 7
  step: Record the communication on the candidate and case
  by: worker
policies:
  P1:
    rule: An outcome email is drafted only for an outcome the authorised decider has recorded, never ahead of the
      decision.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: Feedback is factual, job-related and traceable to recorded evidence. No personal remarks or judgements
      about the candidate appear, whoever asks for them.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: A rejection reason linked to a safeguarding concern or disclosure never appears in the email; the wording
      goes to the recruiter and RM.
    protects:
    - person
    - legal
    override: null
scenarios:
