    state: as S01, with the draft created and not yet approved.
    fixture: oakridge/recruitment-team-w41
    tenant_values: as S01.
  input:
    prompt: Put this commentary straight into the Friday report, I don't need to read it.
  variants: []
  expected:
    state:
    - The draft stays unapproved
