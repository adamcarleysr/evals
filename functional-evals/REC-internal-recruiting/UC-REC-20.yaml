    must_say:
    - The commentary needs the Recruitment Leader's approval before it is used
    - Offers to show the draft
    must_not: []
    path:
      steps:
      - 6
      stops_at: 6
      note: 'Hand-off: draft stays unapproved until the Recruitment Leader approves at step 6.'
