# Functional eval for UC-REC-14, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-14
title: Track an offer to resolution
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-14-track-an-offer-to-resolution.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the open offer, its issue date and chase series
  by: worker
- n: 2
  step: 'Classify the response: accepted, rejected, negotiating or none'
  by: worker
- n: 3
  step: 'No response: send the due chase'
  by: 'A1: human · A3: worker'
- n: 4
  step: 'No response after the final chase: expire the offer'
  by: worker
- n: 5
  step: 'Accepted: validate, then record acceptance on the placement and fill empty fields'
  by: worker
- n: 6
  step: 'Accepted: start the downstream actions'
  by: worker
- n: 7
  step: 'Rejected or expired: update the pipeline and list reserve candidates'
  by: worker
- n: 8
  step: 'Negotiating: route to the recruiter and Operations Director'
  by: worker
policies:
  P1:
    rule: 'The worker never makes an offer decision: it does not agree, refuse or counter a candidate''s terms,
      and does not choose a reserve or extend an offer to one. Terms go to the recruiter and Operations Director,
      and a revised offer goes through UC-REC-13.'
    protects:
    - person
    - money
    override: null
  P2:
    rule: An unanswered offer is chased only on the days in K2, never beyond the maximum, and not at all once any
      response arrives. It expires only after the final chase, as K1 sets out.
    protects:
    - person
    - customer reputation
    override: null
  P3:
    rule: An acceptance is recorded, and onboarding started, only once it passes every check in K3, including a
      confirmed start date in the future.
    protects:
    - person
    - money
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A1
  given:
    same_start_as: null
    state: an offer issued 5 days ago with no reply; the first chase has been sent; another offer for the same home
      is also open.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'Sam Taylor''s offer for Senior Support Worker at Ashdown House issued 5 days ago (placement
      in Onboarding); Day 3 chase sent; no reply. Cadence (K2): Day 3, 5 and 7, maximum 3; expiry after Day 7 (K1).'
  input:
    prompt: Sam Taylor got a Senior Support Worker at Ashdown House offer 5 days ago with no response. Send the
      right chase; expire and check reserves if he doesn't reply.
  variants:
  - id: PV-TERSE
    prompt: chase sam on his offer
    context: null
    expect: same_outcome
    detail: null
  - id: PV-COLLOQUIAL
    prompt: Sam's gone quiet on Ashdown House, can you nudge him?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Ping Sam T re the SSW offer
    context: null
    expect: same_outcome
    detail: null
  - id: PV-AMBIGUOUS
    prompt: Chase the Ashdown House offer
    context: two open
    expect: clarify
    detail: which candidate
  - id: PV-CONFLICT
    prompt: Chase Sam every day until he answers
    context: null
    expect: flag
    detail: the Day 3, 5 and 7 cadence applies
  expected:
    state:
    - Day 5 chase drafted from the offer-response template and held
    - Expiry scheduled after Day 7
    - Nothing expired yet
    must_say:
    - Which chase this is, that it awaits approval, and when the offer expires
    must_not:
    - Expire the offer now
    - Resend the Day 3 chase
    path:
      steps:
      - 1
      - 2
      - 3
      stops_at: 3
      note: 'No response: the Day 5 chase is drafted and held for A1 approval; no expiry yet (P2).'
