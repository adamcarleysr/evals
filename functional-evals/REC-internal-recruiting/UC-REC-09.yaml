# Functional eval for UC-REC-09, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-09
title: Score interview evidence against the rubric
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-09-score-interview-evidence-against-the-rubric.md
status: draft
primary_role: Hiring Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the candidate, vacancy and interview appointment; fetch the recording and transcript and match them
  by: worker
- n: 2
  step: Select the rubric for the role
  by: worker
- n: 3
  step: Map transcript evidence to each question, quoting the passage used
  by: worker
- n: 4
  step: Score each question on the rubric scale, total it, and apply the safeguarding-critical minimum
  by: worker
- n: 5
  step: Review the proposed scores
  by: 'A1: human · A2: worker'
- n: 6
  step: Write the structured scores and evidence note to the ATS
  by: worker
- n: 7
  step: Hand the evidence to the hiring manager's decision queue
  by: worker
policies:
  P1:
    rule: Only the hiring manager decides after the interview. The worker gives the scores, evidence and rubric
      band, never a hire or reject verdict, and does not change the candidate's stage.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: 'Nothing is said about the candidate beyond the rubric evidence: no comment on personality or character,
      and no reasons the transcript does not state.'
    protects:
    - person
    - legal
    override: null
  P3:
    rule: A question is scored only on a quoted passage from the transcript. An answer that cannot be found is unknown,
      never scored from other answers or assumed.
    protects:
    - person
    - legal
    override: null
  P4:
    rule: Any safeguarding-critical question below its minimum in K1 fails the rubric, whatever the total.
    protects:
    - person
    - legal
    override: null
  P5:
    rule: A safeguarding signal in the transcript pauses scoring of that item and goes straight to a named human.
      It is not summarised into the ATS note.
    protects:
    - person
    - legal
    override: null
