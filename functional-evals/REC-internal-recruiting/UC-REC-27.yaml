# Functional eval for UC-REC-27, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-27
title: File evidence to the starter's staff record
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-27-file-evidence-to-the-staff-record.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the starter's staff folder from the Placement
  by: worker
- n: 2
  step: Confirm the document type
  by: worker
- n: 3
  step: Build the filename
  by: worker
- n: 4
  step: Check for a name collision in the target subfolder
  by: worker
- n: 5
  step: Rename and move to the correct subfolder
  by: worker
- n: 6
  step: Read back the final name and path, and record the filing
  by: worker
policies:
  P1:
    rule: Existing evidence in a staff file is never deleted or overwritten. A name collision is resolved with the
      rule in K3, and a possible duplicate is kept and flagged for a person to decide.
    protects:
    - person
    - legal
    - data
    override: null
  P2:
    rule: A document is filed only to the staff folder that matches the Placement, never on the candidate's name
      alone. If none or several match, the file stays where it is.
    protects:
    - person
    - legal
    - data
    override: null
