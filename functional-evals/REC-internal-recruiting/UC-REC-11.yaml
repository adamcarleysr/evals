      3/5 or above (K4: minimum 3/5); Megan Hart (RM, Ashdown House) recorded Progress. Progress after Stage 2 leads
      to Stage 3 (Home Visit) (K1). Prescreen automatic advance at 4.0 or above (K3).'
  input:
