use_case: UC-REC-11
title: Progress a candidate on a decision
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-11-progress-a-candidate-on-a-decision.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the candidate, vacancy and decision; confirm who made it and that they may decide for this home
  by: worker
- n: 2
  step: Look up the rule and check the current stage matches its from-stage
  by: worker
- n: 3
  step: Check thresholds for score-based rules
  by: worker
- n: 4
  step: Confirm a recorded human decision exists for rules that need one
  by: 'A2: human · A3: worker'
- n: 5
  step: Update the stage in the ATS and the case
  by: worker
- n: 6
  step: Log the progression
  by: worker
- n: 7
  step: Start the next step
  by: worker
- n: 8
  step: 'Reverse on correction: restore the earlier stage, add the correction note, list downstream actions already
    taken'
  by: 'A2: human requests · worker executes'
policies:
  P1:
    rule: A transition that needs a human decision happens only once that decision is recorded by the decider. The
      worker never progresses a candidate on a reported, verbal or assumed decision.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: Only a decider with authority for the candidate's home and the decision type in K3 can trigger a progression.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: A score-based transition happens only when the threshold in K4 is met. A safeguarding-critical answer
      below its minimum blocks progression even with an approval, and the conflict goes to the recruiter and RM.
    protects:
    - person
    - legal
    override: null
