  kind: happy
  detail: null
  mode: A0
  given:
    same_start_as: null
    state: placements across all homes in the horizon, including one cancelled, one withdrawn and one deferred;
      a reference calculation of the grid is stored.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'run on Thu 08/10/2026. Horizon (K1): the next four weeks, current week excluded. Sam Taylor''s
      Senior Support Worker at Ashdown House placement is in Onboarding with start date 03/11/2026; seeded placements
      across the nine homes.'
  input:
    prompt: Build the four-week starter forecast grouped by home and week. Exclude cancelled/withdrawn/deferred.
  variants:
  - id: PV-TERSE
    prompt: 4 wk starter forecast
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Who's starting across the houses in the next month or so, by week?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-BUNDLED
    prompt: Build the forecast by home and week and list the Placements behind Ashdown House
    context: null
    expect: same_outcome
    detail: plus the Ashdown House placement list including Sam Taylor
  - id: PV-AMBIGUOUS
    prompt: Forecast for Birch Close
    context: null
    expect: clarify
    detail: 1 Birch Close or 7 Birch Close
  - id: PV-FALSE-PREMISE
    prompt: Why isn't Sam Taylor in the Beacon House forecast?
    context: null
    expect: flag
    detail: his placement is at Ashdown House; show where he is counted
  expected:
    state:
    - Each home and week cell = reference calculation exactly
    - Grand total = number of eligible placements
    - The cancelled, withdrawn and deferred placements are in the excluded list, not the grid
    - Sam Taylor counted once under Ashdown House, week of 02/11/2026
    must_say:
    - The four week buckets with dates, and how many placements were excluded and why
    must_not:
    - Count any placement with no start date
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      stops_at: null
      note: 'Full read-only build: classify under P1, resolve homes, reconcile grid, present and save snapshot.'
