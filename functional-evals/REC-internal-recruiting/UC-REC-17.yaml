# Functional eval for UC-REC-17, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-17
title: Forecast starters
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-17-forecast-starters.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the horizon to week buckets and any home filter to a canonical home
  by: worker
- n: 2
  step: Pull every placement with a start date in the horizon or with no start date
  by: worker
- n: 3
  step: Classify each placement as eligible, excluded (cancelled, withdrawn, deferred) or ambiguous
  by: worker
- n: 4
  step: Resolve each eligible placement's home to a canonical home
  by: worker
- n: 5
  step: Count eligible placements by home and week, and reconcile
  by: worker
- n: 6
  step: Present the grid with the exclusions and exceptions, and save the snapshot
  by: worker
policies:
  P1:
    rule: Only placements with an eligible status in K1 are counted. Cancelled, withdrawn and deferred placements
      are excluded with the reason, and a status not in the mapping is ambiguous and never counted.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: A placement with no start date, or whose home doesn't resolve to a canonical home or a known alias in
      K3, is listed as an exception and never placed in a week or a home.
    protects:
    - data
    - customer reputation
    override: null
scenarios:
