# Functional eval for UC-REC-04, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-04
title: Screen applications against the playbook
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-04-screen-applications-against-the-playbook.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Read the CV and the linked job
  by: worker
- n: 2
  step: Check for a repeat application
  by: worker
- n: 3
  step: Check each mandatory criterion for the role
  by: worker
- n: 4
  step: Score the weighted dimensions
  by: worker
- n: 5
  step: Propose the route
  by: worker
- n: 6
  step: Write the outcome to the application
  by: 'A1: human · A2–A3: worker'
- n: 7
  step: Act on the route
  by: 'A3: worker for the first-stage queue · human for every other route'
policies:
  P1:
    rule: A criterion passes only on evidence in the CV or application. No evidence is a flag (unknown), never a
      pass, and nothing is inferred from name, nationality or address.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: The role's screening criteria are applied every time. An applicant below the threshold goes to the Head
      of Recruitment.
    protects:
    - person
    - legal
    override: the Head of Recruitment can accept a below-threshold applicant through the review route; the decision
      is recorded
  P3:
    rule: Only a person rejects an applicant. The worker may propose a rejection, never make or send one.
    protects:
    - person
    - legal
    override: null
  P4:
    rule: Overseas qualifications, and roles marked as always reviewed in K3, are never progressed automatically.
    protects:
    - person
    - legal
    override: null
