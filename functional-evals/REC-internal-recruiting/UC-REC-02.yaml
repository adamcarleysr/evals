# Functional eval for UC-REC-02, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-02
title: Advertise a vacancy
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-02-advertise-a-vacancy.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Read the job and its approved advert content
  by: worker
- n: 2
  step: Build one advert per board
  by: worker
- n: 3
  step: Check whether the job is already live on each board
  by: worker
- n: 4
  step: Approve the per-board adverts
  by: 'A1–A2: human · A3: worker within rules'
- n: 5
  step: Publish to each approved board
  by: 'A2–A3: worker'
- n: 6
  step: Set up the application link-back to the ATS job
  by: worker
- n: 7
  step: Read each listing back and record where the job is live
  by: worker
policies:
  P1:
    rule: Every advert states the role's requirements from K2. They are never removed or softened to attract applicants,
      and the requirements section is never dropped to fit a board's limit.
    protects:
    - legal
    - customer reputation
    override: null
  P2:
    rule: An advert states only the pay and terms recorded on the job. A missing rate is left out and flagged, never
      estimated.
    protects:
    - legal
    - customer reputation
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A2
  given:
    same_start_as: null
    state: four job boards configured; an open senior support worker job with an approved advert, not yet on any
      board.
    fixture: oakridge/sam-taylor-ashdown-house
    tenant_values: 'with Job Boards A to D. Senior Support Worker at Ashdown House, advert approved. Job Board A
      (K1): HTML, 100-character title, 4,000-character description.'
  input:
    prompt: Publish the approved job advert for Senior Support Worker at Ashdown House to Job Board A. Set up the
      application webhook to link back to the correct ATS vacancy.
  variants:
  - id: PV-TERSE
    prompt: post ashdown senior support worker to board A
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Get the Senior RSW ad for OCG Ashdown House live on board A and hook the apps back to the ATS
    context: null
    expect: same_outcome
    detail: null
  - id: PV-AMBIGUOUS
    prompt: Publish the Senior Support Worker advert to Job Board A
    context: Senior Support Worker jobs open at Ashdown House and Willow Lodge
    expect: clarify
    detail: which job
  - id: PV-FALSE-PREMISE
    prompt: Publish the approved advert for Senior Support Worker at Ashdown House to Job Board A
    context: no advert approved
    expect: flag
    detail: no approved advert; offer to draft one at A1
  expected:
    state:
    - One Job Board A listing, HTML, title "Senior Support Worker - Ashdown House, Oakridge - Oakridge Care Group",
      within Job Board A's limits
    - Link-back to the Ashdown House job
    - Note on the job
    - Audit entry
    must_say:
    - The listing reference, that applications route to the Ashdown House job ID, and the read-back result
    must_not:
    - Publish to other boards
    path:
      steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      stops_at: null
      note: 'Unclear: assumes approved advert covers step 4 in A2; publishes to Board A only, links back, reads
        back.'
