use_case: UC-REC-31
title: Monitor active onboarding cases in a pinned case view
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-31-onboarding-case-view.md
status: draft
primary_role: Compliance Officer
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the viewer's scope
  by: worker
- n: 2
  step: Load every active case in scope
  by: worker
- n: 3
  step: Build each row
  by: worker
- n: 4
