  by: worker
- n: 6
  step: Keep the view pinned and current
  by: worker
policies:
  P1:
    rule: 'A value the case doesn''t have is shown as missing, with its reason ("start date missing", "next chase:
      none, stopped (reason)", "escalated"), never as a blank, a 0 or an estimate.'
    protects:
    - data
    - customer reputation
    override: null
