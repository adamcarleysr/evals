# Functional eval for UC-REC-31 (generic). Parameterised. Draft: pending sign-off.
use_case: UC-REC-31
title: Monitor active onboarding cases in a pinned case view
use_case_version: "0.2"
status: draft
primary_role: Compliance Officer
process_style: prescribed

# ---------------------------------------------------------------------------
# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity  - a record or person in the instance's test data
#         policy  - a value from the instance's playbooks
#         text    - wording the instance uses
#         date    - computed at run time from run_date and other parameters (never bound)
# ---------------------------------------------------------------------------
parameters:
  candidate_name:        {kind: entity, about: "A candidate with an active onboarding case in the viewer's scope", example: "Sam Taylor"}
  active_case_count:     {kind: entity, about: "How many active onboarding cases are in the viewer's scope in the test data", example: 12}
  old_case_count:        {kind: entity, about: "How many of those cases are older than the age threshold (fewer than active_case_count)", example: 2}
  outstanding_document:  {kind: text,   about: "A document outstanding on the candidate's case", example: "DBS certificate"}
  outstanding_reference: {kind: text,   about: "A reference outstanding on the candidate's case", example: "Reference 2"}
  evidence_stage:        {kind: text,   about: "The case stage while evidence is collected", example: "evidence collection"}

  age_threshold:         {kind: policy, unit: days, about: "Case age above which a case is highlighted", example: 30}
  start_window:          {kind: policy, unit: days, about: "The look-ahead used to filter starters with outstanding items", example: 14}

  start_date:            {kind: date, value: "run_date + 7 days", about: "The candidate's expected start (inside the start window)"}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Resolve the viewer's scope", by: worker}
  - {n: 2, step: "Load every active case in scope", by: worker}
  - {n: 3, step: "Build each row", by: worker}
  - {n: 4, step: "Highlight and filter", by: worker}
  - {n: 5, step: "Open a case", by: worker}
  - {n: 6, step: "Keep the view pinned and current", by: worker}

policies:
  P1: {rule: "A value the case doesn't have is shown as missing, with its reason (\"start date missing\", \"next chase: none, stopped (reason)\", \"escalated\"), never as a blank, a 0 or an estimate.", protects: [data, customer reputation]}

scenarios:
  - id: S01
    kind: happy
    mode: A0
    given:
      state: "{active_case_count} active onboarding cases in the viewer's scope, {old_case_count} of them opened more than {age_threshold} days ago. {candidate_name}'s case is at {evidence_stage} with {outstanding_reference} and the {outstanding_document} outstanding, expected start {start_date}."
      conditions: ["{active_case_count} active onboarding cases in one compliance user's scope", "{old_case_count} of them opened more than {age_threshold} days ago", "{candidate_name}'s case at {evidence_stage} with {outstanding_reference} and the {outstanding_document} outstanding"]
    input:
      prompt: "Show the compliance case view for all active onboarding cases. Highlight cases older than {age_threshold} days."
    variants:
      - {id: PV-TERSE, prompt: "case view, flag {age_threshold}+ days", expect: same_outcome}
      - {id: PV-COLLOQUIAL, prompt: "What's going on with all our new starters' paperwork?", expect: same_outcome}
      - {id: PV-MISSING, prompt: "Highlight the old ones", context: "no view open, no age given", expect: clarify, detail: "which view and what age"}
      - {id: PV-FALSE-PREMISE, prompt: "Show me the {active_case_count} cases that are over {age_threshold} days old", expect: flag, detail: "only {old_case_count} cases are over {age_threshold} days"}
    expected:
      state: ["Nothing written"]
      must_say: ["{active_case_count} cases, each with stage, outstanding items, case age, next chase, last contact, failures, pending approvals and expected start", "The {old_case_count} cases older than {age_threshold} days highlighted"]
      must_not: ["Change any case", "Drop a case from the list"]
      path: {steps: [1, 2, 3, 4, 6], stops_at: null, note: "Read-only A0 view built for all cases in scope, highlighting the cases over the age threshold."}

  - id: S02
    kind: edge
    detail: filter
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, with start dates spread over the coming weeks, and at least one case with no start date."
      conditions: ["Active cases with start dates both inside and beyond {start_window} days", "At least one active case with no start date"]
    input:
      prompt: "Filter the case view to starters in the next {start_window} days with outstanding items."
    expected:
      state: ["Nothing written"]
      must_say: ["Only cases with a start date in the next {start_window} days and at least one outstanding item, including {candidate_name} (start {start_date})", "Cases with no start date listed separately"]
      must_not: ["Include a case starting after {start_window} days", "Drop the cases with no start date"]
      path: {steps: [1, 2, 3, 4, 6], stops_at: null, note: "Filter applied at step 4; cases without a start date shown separately (P1)."}

  - id: S03
    kind: edge
    detail: drill-down
    mode: A0
    given:
      same_start_as: S01
      state: "As S01."
      conditions: ["{candidate_name}'s case history with a handoff, classifications, filings, syncs, chases, stage changes, approvals and at least one failure in the audit trail"]
    input:
      prompt: "Open {candidate_name}'s case from the view."
    expected:
      state: ["Nothing written"]
      must_say: ["The full case history (handoff, classifications, filings, syncs, chases, stage changes, approvals, failures), matching the audit trail entry for entry"]
      must_not: ["Omit a failed or retried entry"]
      path: {steps: [1, 5], stops_at: null, note: "Drill-down: scope checked then the case opened with history matching the audit trail."}

  - id: S04
    kind: policy
    detail: P1
    mode: A0
    given:
      same_start_as: S01
      state: "As S01; one case has no expected start date and a chase series that stopped because the candidate responded."
      conditions: ["One active case with no start date and a chase series stopped by a candidate reply"]
    input:
      prompt: "Show the compliance case view."
    expected:
      state: ["Nothing written"]
      must_say: ["\"start date missing\" for that case", "\"next chase: none, stopped (candidate responded)\" for that case"]
      must_not: ["Show a blank, 0 or an estimated date"]
      path: {steps: [1, 2, 3, 4, 6], stops_at: null, note: "P1 and step 3 extensions: shows \"start date missing\" and the stopped-chase reason, never blanks."}
