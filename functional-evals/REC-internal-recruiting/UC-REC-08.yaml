# Functional eval for UC-REC-08, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-08
title: Schedule an interview
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-08-schedule-an-interview.md
status: draft
primary_role: Recruiter
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the candidate, job, stage, interview type and interviewer
  by: worker
- n: 2
  step: Read availability on both sides
  by: worker
- n: 3
  step: Propose or select the slot
  by: worker
- n: 4
  step: Approve the booking
  by: 'A1: human · A3: worker'
- n: 5
  step: Re-check for conflicts, then book and invite
  by: 'A1: human · A3: worker'
- n: 6
  step: Write the appointment to the ATS and read it back
  by: worker
- n: 7
  step: Schedule the reminders
  by: worker
- n: 8
  step: Handle a reschedule or cancellation
  by: 'A3: worker within rules · human otherwise'
policies:
  P1:
    rule: A candidate-initiated reschedule is made automatically only outside the notice period and within the limit
      in K3. Inside the notice period, or at the limit, the recruiter decides.
    protects:
    - person
    - customer reputation
    override: null
  P2:
    rule: No candidate or interviewer is double-booked. A booking or reschedule leaves exactly one live interview,
      with any old event and reminders removed.
    protects:
    - person
    - customer reputation
    override: null
