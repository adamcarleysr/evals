# Functional eval for UC-REC-22, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-22
title: Produce the board report
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-22-produce-the-board-report.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the period and load the governed snapshots for it
  by: worker
- n: 2
  step: Calculate each template section through the dashboard's calculation path
  by: worker
- n: 3
  step: Run the pre-publication checks
  by: worker
- n: 4
  step: Attach lineage to every figure
  by: worker
- n: 5
  step: Draft the executive summary and commentary (UC-REC-20)
  by: worker
- n: 6
  step: Render tables and charts into the template and version it
  by: worker
- n: 7
  step: 'Release: review at A1; at A3 scope the sections per recipient and distribute'
  by: 'A1: human · A3: worker'
policies:
  P1:
    rule: 'Every figure comes from the dashboard''s calculation path and carries its lineage: source period, entity
      count, filters and record IDs. A figure that differs from the dashboard or has no lineage is left out and
      listed.'
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: A missing snapshot or incomplete data is shown as unavailable for the weeks affected, in the section and
      in the summary. It is never estimated or interpolated.
    protects:
    - data
    - customer reputation
    override: null
  P3:
    rule: 'The summary and commentary state only what the figures show: no causes, and no claims about anyone''s
      performance.'
    protects:
    - person
    - customer reputation
    override: null
  P4:
    rule: Only recipients on the governed list in K1 receive the report, and each receives only the sections in
      their scope.
    protects:
    - data
    - customer reputation
    override: null
