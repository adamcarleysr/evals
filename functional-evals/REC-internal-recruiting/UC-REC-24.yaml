# Functional eval for UC-REC-24, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-24
title: Recruitment Leader dashboard
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-24-recruitment-leader-dashboard.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Open the pinned view with the viewer's saved layout and filters
  by: worker
- n: 2
  step: Apply the viewer's permission scope
  by: worker
- n: 3
  step: 'Load the tiles from the governed calculation layer: recruiter KPI table, team totals, forecast by home,
    trends'
  by: worker
- n: 4
  step: Load open data-quality items and mark qualified tiles
  by: worker
- n: 5
  step: Refresh on change and on schedule; label stale tiles
  by: worker
- n: 6
  step: Drill from any total to its contributing rows and records
  by: worker
policies:
  P1:
    rule: Every tile, drill-down and chat answer uses the governed definitions in K1, so the same question gives
      the same number for the same period. No tile computes its own version of a metric.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: A tile older than the stale threshold, or whose last refresh failed, is labelled with its last refresh
      time and is never presented as current.
    protects:
    - data
    - customer reputation
    override: null
