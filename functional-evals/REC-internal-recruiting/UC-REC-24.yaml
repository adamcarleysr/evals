    context: null
    expect: same_outcome
    detail: null
  - id: PV-AMBIGUOUS
    prompt: Show me the dashboard
    context: the viewer has both this and a recruiter workbench pinned
    expect: clarify
    detail: which dashboard
  - id: PV-FALSE-PREMISE
