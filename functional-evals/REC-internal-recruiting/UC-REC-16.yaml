# Functional eval for UC-REC-16, generated from the use case. Draft: pending sign-off.
use_case: UC-REC-16
title: Calculate recruitment KPIs
use_case_version: '0.2'
source: verticals/REC-internal-recruiting/UC-REC-16-calculate-recruitment-kpis.md
status: draft
primary_role: Recruitment Leader
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the period to week boundaries and the scope to canonical recruiter IDs
  by: worker
- n: 2
  step: Load the governed definition, data source and target for each KPI
  by: worker
- n: 3
  step: Pull every source record for the period
  by: worker
- n: 4
  step: Map activity types to KPI categories
  by: worker
- n: 5
  step: Calculate actual per recruiter and team, variance against target and delta against the previous period's
    snapshot
  by: worker
- n: 6
  step: Reconcile team totals to the recruiter rows and present them with the scope and period stated
  by: worker
policies:
  P1:
    rule: Each KPI is calculated only from its governed definition in K1. A KPI with no governed definition is reported
      as "no definition", and no other formula is used, whatever the request.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: A missing value, target or baseline is shown as "unavailable" with the reason, never as zero. A team total
      with missing recruiter values is shown as partial, with the number of recruiters missing.
    protects:
    - data
    - customer reputation
    override: null
  P3:
    rule: An activity record counts towards a KPI only if its activity type is mapped in K3. Unmapped records are
      excluded and listed, never assigned to the closest KPI.
    protects:
    - data
    override: null
