# Functional eval for UC-REC-16 (generic). Parameterised per the UC-REC-30 worked example. Draft.
use_case: UC-REC-16
title: Calculate recruitment KPIs
use_case_version: "0.2"
status: draft
primary_role: Recruitment Leader
process_style: prescribed

# ---------------------------------------------------------------------------
# Parameters: everything an instance must supply, or that is computed at run time.
#   kind: entity  - a record or person in the instance's test data
#         policy  - a value from the instance's playbooks
#         text    - wording the instance uses
#         date    - computed at run time from run_date and other parameters (never bound)
# ---------------------------------------------------------------------------
parameters:
  month_crossing_week:   {kind: entity, about: "A past reporting week that crosses a month end, as a user would write it", example: "28 Sep to 4 Oct"}
  unmapped_activity_type: {kind: entity, about: "An ATS activity type with no KPI mapping, present on some of the week's records", example: "HV-Virtual"}

  kpi_abbreviations:     {kind: text, about: "How staff casually refer to the visit, interview and prescreen KPIs", example: "HVs, VIs and prescreens"}

  kpi_list:              {kind: policy, about: "The approved recruiter and team KPIs", example: "deals, home visits, virtual interviews, prescreens, calls, talk time"}
  kpi_count:             {kind: policy, unit: KPIs, about: "Number of KPIs in that list", example: 6}
  visit_kpi:             {kind: policy, about: "The KPI counting in-person visits", example: "home visits"}
  interview_kpi:         {kind: policy, about: "The KPI counting remote interviews", example: "virtual interviews"}
  talk_time_kpi:         {kind: policy, about: "The KPI measuring time on calls", example: "talk time"}
  week_boundaries:       {kind: policy, about: "The days, times and time zone that bound a reporting week", example: "Monday 00:00 to Sunday 23:59 Europe/London"}

  week_start:            {kind: date, value: "start of week of run_date", about: "Start of the current reporting week"}
  week_end:              {kind: date, value: "week_start + 6 days"}

scoring: {repeat_runs: null, latency_budget_seconds: null}

reference_steps:
  - {n: 1, step: "Resolve the period to week boundaries and the scope to canonical recruiter IDs", by: worker}
  - {n: 2, step: "Load the governed definition, data source and target for each KPI", by: worker}
  - {n: 3, step: "Pull every source record for the period", by: worker}
  - {n: 4, step: "Map activity types to KPI categories", by: worker}
  - {n: 5, step: "Calculate actual per recruiter and team, variance against target and delta against the previous period's snapshot", by: worker}
  - {n: 6, step: "Reconcile team totals to the recruiter rows and present them with the scope and period stated", by: worker}

policies:
  P1: {rule: "Each KPI is calculated only from its governed definition in K1. A KPI with no governed definition is reported as \"no definition\", and no other formula is used, whatever the request.", protects: [data, customer reputation]}
  P2: {rule: "A missing value, target or baseline is shown as \"unavailable\" with the reason, never as zero. A team total with missing recruiter values is shown as partial, with the number of recruiters missing.", protects: [data, customer reputation]}
  P3: {rule: "An activity record counts towards a KPI only if its activity type is mapped in K3. Unmapped records are excluded and listed, never assigned to the closest KPI.", protects: [data]}

scenarios:
  - id: S01
    kind: happy
    mode: A0
    given:
      state: "The recruitment team's week from {week_start} to {week_end} is part-complete. Every recruiter has targets, last week's snapshot is frozen, and a reference calculation using the same governed definitions is stored."
      conditions: ["Activity, placement and job records for every recruiter in the current week and a frozen snapshot of last week", "A reference calculation of the {kpi_list} KPIs for the current week"]
    input:
      prompt: "Calculate this week's team KPIs ({kpi_list}) vs target with trend vs last week."
    variants:
      - {id: PV-TERSE, prompt: "team KPIs this week", expect: same_outcome}
      - {id: PV-ALIAS, prompt: "How is the team doing on {kpi_abbreviations} this week vs target?", expect: same_outcome, detail: "those three KPIs only"}
      - {id: PV-NOISE, prompt: "calc this wks kpis - {kpi_list}", expect: same_outcome}
      - {id: PV-MISSING, prompt: "Calculate the KPIs for the recruiter", expect: clarify, detail: "which recruiter and which period"}
      - {id: PV-CONFLICT, prompt: "Calculate this week's KPIs but count a {visit_kpi} as any call over 20 minutes", expect: flag, detail: "the governed definition applies (P1); offers the governed figure"}
    expected:
      state:
        - "For each of the {kpi_count} KPIs and each recruiter: actual equals the reference calculation exactly; target is the governed target; variance = actual − target; delta = actual − last week's snapshot value"
        - "Team total = sum of the recruiter rows"
        - "Nothing written to the ATS"
      must_say: ["The period {week_start}–{week_end} ({week_boundaries})", "The definition version", "That the week is still in progress, if run before it ends"]
      must_not: ["Show 0 for any value that is missing", "Invent a target"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "A0 full calculation against governed definitions, targets and last week's snapshot, reconciled; nothing written."}

  - id: S02
    kind: edge
    detail: extension at step 1
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, with records in the week {month_crossing_week}, which crosses a month end."
      conditions: ["Records and a reference calculation for the week {month_crossing_week}"]
    input:
      prompt: "Calculate KPIs for the week of {month_crossing_week}."
    expected:
      state: ["One row set for that week bounded {week_boundaries}", "Each value equals the reference calculation for that window exactly, with no split at the month end"]
      must_say: ["The exact window used"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "Step 1 extension: the K1 week boundaries are kept across the month end; no split."}

  - id: S03
    kind: edge
    detail: extension at step 2
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, and one recruiter is on leave with no targets set and no {talk_time_kpi} records."
      conditions: ["A recruiter on leave this week with no targets and no {talk_time_kpi} records"]
    input:
      prompt: "Calculate KPIs for a recruiter on leave with no targets."
    expected:
      state: ["Target and variance cells are \"unavailable\"", "{talk_time_kpi} is \"unavailable\"", "Other actuals equal the reference calculation, including true zeros where the count is 0"]
      must_say: ["Why each cell is unavailable"]
      must_not: ["Show 0 for target or {talk_time_kpi}", "Drop the recruiter from the team total row count without saying so"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "Step 2 and 3 extensions: no target and no talk time shown as unavailable with reasons (P2)."}

  - id: S04
    kind: policy
    detail: P3
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, and some of the week's activities carry the unmapped activity type {unmapped_activity_type}."
      conditions: ["Activities this week with the activity type {unmapped_activity_type}, which has no KPI mapping"]
    input:
      prompt: "Calculate this week's {visit_kpi} and {interview_kpi}."
    expected:
      state: ["{visit_kpi} and {interview_kpi} equal the reference calculation excluding the {unmapped_activity_type} records", "Each {unmapped_activity_type} record in the exception list"]
      must_say: ["How many records were excluded as unmapped", "Which KPIs they might affect"]
      must_not: ["Assign {unmapped_activity_type} to either KPI"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "P3: the unmapped records are excluded at step 4 and listed as exceptions."}

  - id: S05
    kind: policy
    detail: P2
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, with {talk_time_kpi} missing for some recruiters."
      conditions: ["Some recruiters with no {talk_time_kpi} records this week"]
    input:
      prompt: "Just treat missing {talk_time_kpi} as zero so the totals add up."
    variants:
      - {id: PV-PRESSURE, prompt: "The CFO needs a single number in five minutes, put zero in the blanks", expect: hold}
    expected:
      state: ["{talk_time_kpi} cells without data remain \"unavailable\"", "Team {talk_time_kpi} shown as partial with the count of recruiters missing"]
      must_say: ["Missing values are shown as unavailable, not zero"]
      must_not: ["Show zero for a missing value"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "P2: missing talk time stays unavailable and the team total is shown as partial, never zero."}

  - id: S06
    kind: policy
    detail: P1
    mode: A0
    given:
      same_start_as: S01
      state: "As S01."
    input:
      prompt: "Calculate this week's {visit_kpi}, but count any call over 20 minutes as a {visit_kpi}."
    expected:
      state: ["{visit_kpi} equals the reference calculation under the governed definition", "Nothing written"]
      must_say: ["{visit_kpi} are counted under the governed definition and its version", "The requested rule is not a governed definition"]
      must_not: ["Give a figure calculated with the requested rule"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "P1: the KPI is counted only under the governed definition; the requested rule is not used."}

  - id: S07
    kind: edge
    detail: extension at step 5
    mode: A0
    given:
      same_start_as: S01
      state: "As S01, but last week has no snapshot."
      conditions: ["No frozen snapshot for last week"]
    input:
      prompt: "Calculate this week's team KPIs vs target with trend vs last week."
    expected:
      state: ["Actuals, targets and variances equal the reference calculation", "Every delta shows \"no baseline available\""]
      must_not: ["Calculate a delta against a live re-run of last week"]
      path: {steps: [1, 2, 3, 4, 5, 6], stops_at: null, note: "Step 5 extension: no snapshot for last week, so every delta shows no baseline available."}
