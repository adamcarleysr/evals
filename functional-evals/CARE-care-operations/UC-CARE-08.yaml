# Functional eval for UC-CARE-08, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-08
title: Record an approved rota change
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-08-record-an-approved-rota-change.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the employees, home and dates
  by: worker
- n: 2
  step: Map the change to entries and compare with the current rota
  by: worker
- n: 3
  step: Validate the write plan
  by: worker
- n: 4
  step: Confirm approval by an authorised approver
  by: 'A1: human · A2: worker checks the recorded approval'
- n: 5
  step: Write each entry not already in place
  by: worker
- n: 6
  step: Read back and compare
  by: worker
- n: 7
  step: Log and report
  by: worker
policies:
  P1:
    rule: A rota change is written only with a recorded approval from a person K4 authorises for that change type
      and home. A request, or an approval from someone outside that scope, is not enough.
    protects:
    - person
    - legal
    override: the senior leader named in K4 may override with a logged justification ⚠ verify
  P2:
    rule: No entry is written that would leave an employee with two entries for the same time, or put them on the
      rota of a home they are not assigned to.
    protects:
    - person
    - data
    override: null
