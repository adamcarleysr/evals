# Functional eval for UC-CARE-07, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-07
title: Review a home's rota for staffing gaps
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-07-review-a-homes-rota-for-staffing-gaps.md
status: draft
primary_role: Registered Manager
process_style: guided
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the home, the period and the asker's scope
  by: worker
- n: 2
  step: Read every rota entry and absence for the home's staff in the period
  by: worker
- n: 3
  step: Compare each shift's cover with the staffing requirement
  by: worker
- n: 4
  step: Find anomalies
  by: worker
- n: 5
  step: Answer with scope, as-at time, gaps and anomalies, and offer next steps
  by: worker
policies:
  P1:
    rule: A shift is called a gap only when its cover is below the home's staffing requirement in K3. Without a
      requirement, the worker reports cover only.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: The summary states rota facts only. It gives no reason for an absence beyond its recorded type, and no
      comment on any staff member's reliability or conduct.
    protects:
    - person
    - data
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A0
  given:
    same_start_as: null
    state: a home's rota for the current week, with one night shift under-covered, one day shift where a rostered
      worker is on approved leave, and one worker rostered on overlapping shifts.
    fixture: oakridge/rota-willow-lodge-w42
    tenant_values: 'Willow Lodge, week Mon 12/10/2026 to Sun 18/10/2026; RM Dana Bennett. K1: Day 08:00–20:00, Night
      20:00–08:00, Sleep-in 22:00–07:00. K3: 3 staff per day shift, 2 per night shift. Wednesday night has 1 rostered;
      Thursday day has 3 rostered, including Ellie Morgan, who is on approved annual leave that day; Ryan Cole on
      Friday day and Friday night. Rota refreshed 40 minutes ago.'
  input:
    prompt: 'Show me this week''s rota for Willow Lodge from the HR system and summarise any staffing gaps, shift
      coverage issues or anomalies. Read-only: don''t change anything.'
  variants:
  - id: PV-TERSE
    prompt: willow rota this week, any gaps?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: Any holes in the Willow roster for w/c 12th?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-COLLOQUIAL
    prompt: I'm worried we're short at Willow this week, can you have a look at the rota?
    context: null
    expect: same_outcome
    detail: null
  - id: PV-MISSING
    prompt: Check the rota for gaps
    context: the asker manages no single home
    expect: clarify
    detail: which home and which week
  - id: PV-FALSE-PREMISE
    prompt: Why is Saturday night uncovered at Willow Lodge?
    context: null
    expect: flag
    detail: Saturday night has 2 of 2; the gap is Wednesday night
  expected:
    state:
    - Nothing written
    must_say:
    - Wednesday night has 1 of 2 required
    - Thursday day is 2 of 3 because Ellie Morgan is on annual leave
    - Ryan Cole's overlapping Friday shifts
    - The as-at time
    - Offers to find cover or record a change
    must_not:
    - Change the rota
    - Give a reason for anyone's absence
    path:
      steps: null
      stops_at: null
      note: TODO
