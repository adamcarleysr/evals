use_case: UC-CARE-04
title: Book a contractor within the access window and spend limit
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-04-book-a-contractor-within-the-access-window-and-spend-limit.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the case, contractor, quote and requested time
  by: worker
- n: 2
  step: Check for an existing booking for the same job
  by: worker
- n: 3
  step: Check the time against the home's access window
  by: worker
- n: 4
  step: Work out the approval tier
  by: worker
- n: 5
  step: Get the approval for the tier
  by: 'A1: human · A3: worker within auto-approve, otherwise the tier''s approver'
- n: 6
  step: Book the appointment and notify the contractor and the RM
  by: 'A1: human · A3: worker'
- n: 7
  step: Record the booking and the approval on the case
  by: worker
policies:
  P1:
    rule: Nothing above the auto-approve limit in K1 for the job's category is booked until the approver for that
      tier in K2 has approved it. Above-limit work is never committed silently.
    protects:
    - money
    override: the gate override holder in K2, with a logged justification
  P2:
    rule: A second contractor is never booked for the same job under K4.
    protects:
    - money
    - customer reputation
    override: null
  P3:
    rule: A contractor is booked only inside the home's access window in K3. A time outside it is flagged to the
      RM, not booked.
    protects:
    - person
    - customer reputation
    override: null
