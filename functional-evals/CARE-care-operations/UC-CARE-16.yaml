# Functional eval for UC-CARE-16, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-16
title: Alert managers to absence triggers
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-16-alert-managers-to-absence-triggers.md
status: draft
primary_role: Head of People
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Read absence records for the rolling windows in K2
  by: worker
- n: 2
  step: Evaluate each trigger per employee
  by: worker
- n: 3
  step: Remove triggers already alerted for the same window
  by: worker
- n: 4
  step: Resolve recipients for each alert
  by: worker
- n: 5
  step: Draft one alert per employee and trigger
  by: worker
- n: 6
  step: Approve and send
  by: 'A1: human · A3: worker'
- n: 7
  step: Log each alert
  by: worker
policies:
  P1:
    rule: An alert states the trigger reached and the next step K2 requires. The worker never decides or suggests
      a disciplinary or other employment outcome, and never comments on why the employee was absent.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: An employee's absence details go only to the recipients in K3 for that employee. No alert lists another
      employee.
    protects:
    - person
    - data
    override: null
  P3:
    rule: An absence type K2 marks as immediate is alerted as soon as it is recorded, never held back for a later
      batch.
    protects:
    - person
    override: null
