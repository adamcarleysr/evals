  playbook_values:
  # Maintenance (UC-CARE-01 to 05)
  - {knowledge_item: K3, use_case: UC-CARE-01, value: Closure sign-off by the RM within 48 hours, else escalated to the RI}
  - {knowledge_item: K3, use_case: UC-CARE-01, value: Policy-override holder may bypass the sign-off gate with a logged justification (holder not named)}
  - {knowledge_item: K4, use_case: UC-CARE-01, value: 'Recurrence = 2 or more cases of the same category at the home within 90 days, told to the RM and RI; safety reinspection within 7 days'}
  - {knowledge_item: K2, use_case: UC-CARE-02, value: 'Urgent = active water ingress or loss of an essential service, contractor attendance within 24 hours (fixture value, no source page)'}
  - {knowledge_item: K2, use_case: UC-CARE-02, value: 'Low = damage to fittings or furniture with no reported risk of harm (fixture value, no source page)'}
  - {knowledge_item: K3, use_case: UC-CARE-02, value: 'Urgent maintenance: RM and Operations Director at once, RM within 2 hours, RI within 24 hours; automatic sending allowed'}
  - {knowledge_item: K4, use_case: UC-CARE-02, value: 'Any fault on fire detection or alarm equipment is safety-critical, routed at once to the RM and the Operations Director (fixture value, no source page)'}
  - {knowledge_item: K2, use_case: UC-CARE-03, value: 'No answer: 3 attempts over 24 hours; maximum 3 attempts per contact per case in 48 hours; then the home''s RM'}
  - {knowledge_item: K4, use_case: UC-CARE-03, value: Emergency plumbing auto-approve up to £250}
  - {knowledge_item: K1, use_case: UC-CARE-04, value: 'Emergency plumbing: auto-approve up to £250, RM £251–£500, senior approver above £500'}
  - {knowledge_item: K1, use_case: UC-CARE-04, value: 'General repair: auto-approve up to £150, RM £151–£400, senior approver above £400 (also UC-CARE-05 S02 K1)'}
  - {knowledge_item: K2, use_case: UC-CARE-04, value: 'RM approval within 4 hours, else the RI (Graham Okoye); senior approver Operations Director Jordan Blake, within 24 hours'}
  - {knowledge_item: K2, use_case: UC-CARE-04, value: Gate override holder may override with a logged justification (holder not named)}
  - {knowledge_item: K3, use_case: UC-CARE-04, value: 'Ashdown House access window Monday to Friday, 9am to 5pm (also UC-CARE-03)'}
  - {knowledge_item: K4, use_case: UC-CARE-04, value: 'Duplicate booking = same issue, same home, within 48 hours (fixture value)'}
  - {knowledge_item: K2, use_case: UC-CARE-05, value: 'Spend = invoiced amount, by case closure date; recipients per home: its RI; reports run on the first working day of the month, 9am (fixture values)'}
  # Incidents (UC-CARE-06)
  - {knowledge_item: K1, use_case: UC-CARE-06, value: 'Medication error, High: RM and Deputy immediately; RI within 4 hours; clinical psychologist and parents or guardians within 24 hours; RM approves the parent notification'}
  - {knowledge_item: K1, use_case: UC-CARE-06, value: 'Safeguarding concern, Critical: RM, RI and senior leader immediately; Ofsted and LADO within 24 hours; RI approves external notifications'}
  - {knowledge_item: K1, use_case: UC-CARE-06, value: 'Property damage, Medium: RM immediately; RI if over £500; Operations Director within 24 hours; automated notification acceptable'}
  - {knowledge_item: K1, use_case: UC-CARE-06, value: 'Missing child, Critical: RM, RI, police and senior leader immediately; Ofsted, parents or guardians and placing authority within 24 hours; RM coordinates with the police; RI approves the Ofsted notification'}
  - {knowledge_item: K1, use_case: UC-CARE-06, value: '"resident fall, no injury" is not a category in the routing rules'}
  - {knowledge_item: K3, use_case: UC-CARE-06, value: Escalate 2 hours before the deadline}
  - {knowledge_item: K4, use_case: UC-CARE-06, value: 'Ofsted notification approver RI, escalation to the senior leader'}
  # Rota and shifts (UC-CARE-07 to 10)
  - {knowledge_item: K1, use_case: UC-CARE-07, value: 'Day 08:00–20:00, Night 20:00–08:00, Sleep-in 22:00–07:00'}
  - {knowledge_item: K3, use_case: UC-CARE-07, value: 'Willow Lodge: 3 staff per day shift, 2 per night shift'}
  - {knowledge_item: K4, use_case: UC-CARE-07, value: 'Rota refreshed every 2 hours, flagged as stale after 8 hours (UC-CARE-10 K4: stale after 8 hours)'}
  - {knowledge_item: K2, use_case: UC-CARE-08, value: 'Night 20:00–08:00, code NIGHT-STD'}
  - {knowledge_item: K4, use_case: UC-CARE-08, value: 'Rota change approved by the RM or Deputy, escalation to the RI after 4 hours; absence entries approved by the RM'}
  - {knowledge_item: K2, use_case: UC-CARE-09, value: 'No answer: 3 attempts over 24 hours; overall maximum 3 attempts per contact per shift in 48 hours, then the RM'}
  - {knowledge_item: K1, use_case: UC-CARE-10, value: 'Contractor booking £320 is in the RM approval band, 4-hour limit'}
  # People analytics (UC-CARE-11 to 17)
  - {knowledge_item: K1, use_case: UC-CARE-11, value: 'Definitions v1.0: headcount (active employees, point-in-time); starters and leavers (hire and termination date in period, monthly); turnover (leavers in period ÷ average headcount, rolling 12 months); absence rate (sick days lost ÷ working days available, monthly); probation completion rate (quarterly); average tenure (months from hire date); leaver reasons (by termination reason code); no retention metric'}
  - {knowledge_item: K4, use_case: UC-CARE-11, value: HR data stale threshold 8 hours}
  - {knowledge_item: K1, use_case: UC-CARE-12, value: 'Weekly list: Helen Marsh (Head of People), Sam Okafor (Confidential tier); monthly adds RIs Graham Okoye (North) and Aisha Khan (South) and each RM''s home-level extract'}
  - {knowledge_item: K3, use_case: UC-CARE-12, value: 'RM tier: internal, own home only; export approver Sam Okafor'}
  - {knowledge_item: K4, use_case: UC-CARE-12, value: Block threshold 24 hours}
  - {knowledge_item: K5, use_case: UC-CARE-12, value: Weekly send time 12:00 (Friday)}
  - {knowledge_item: K3, use_case: UC-CARE-13, value: 'Warning threshold 8 hours, block threshold 24 hours; alert to the People team after 3 failed refreshes'}
  - {knowledge_item: K2, use_case: UC-CARE-14, value: '"OCG Willow" is a mapped alias for Willow Lodge'}
  - {knowledge_item: K2, use_case: UC-CARE-15, value: 'Initial reminder at 14 days; urgent at 7 days copying the RI; overdue alert on the date to manager, RI and People team; final notice at 7 days overdue with escalation to the Head of People'}
  - {knowledge_item: K3, use_case: UC-CARE-15, value: 'Megan Hart (RM, Ashdown House), Dana Bennett (RM, Willow Lodge), Graham Okoye (RI), Tom Reid (People team), Helen Marsh (Head of People); an RM''s review owner is the RI (Graham Okoye), first escalation Ruth Collins (Head of Care)'}
  - {knowledge_item: K1, use_case: UC-CARE-15, value: An extension is approved by the RI}
  - {knowledge_item: K2, use_case: UC-CARE-16, value: '3 instances in rolling 3 months → informal conversation reminder to the RM; 5 instances in rolling 6 months → formal meeting required; 10 or more consecutive days → return-to-work meeting mandatory, occupational health referral if recurring; unauthorised absence counts double and alerts the RM and RI immediately'}
  - {knowledge_item: K3, use_case: UC-CARE-16, value: 'Megan Hart (RM, Ashdown House), Dana Bennett (RM, Willow Lodge), Graham Okoye (RI)'}
  - {knowledge_item: K1, use_case: UC-CARE-17, value: 'Issue owners: missing manager → RM of the home; unmapped home and unmapped role → Tom Reid; hire date → Ella Watts; missing leaver reason → RM of the former home; missing probation end date → RM'}
  - {knowledge_item: K2, use_case: UC-CARE-17, value: 'Pattern: same field, same home, 3 or more times in 30 days'}
