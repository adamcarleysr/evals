# Fixtures for CARE functional evals. Draft: pending sign-off. All names and data are fictional.
# superreach_state: Superreach's own state (maintenance case state, approvals, queues, snapshots, pack versions); not an external system.
# reference_data: stored reference values the evals score against.
# Every scenario in UC-CARE-01 to 17 names a fixture, so `unnamed` is empty. The eval files use `given.same_start_as` for "after".
tenant: Oakridge Care Group
shared:
  homes:
  - Ashdown House (North region, RI Graham Okoye; access window Monday to Friday, 9am to 5pm)
  - Willow Lodge (North region, RI Graham Okoye; known alias "OCG Willow", UC-CARE-14 K2)
  - Larch House (North region, RI Graham Okoye)
  - Rowan House (South region, RI Aisha Khan)
