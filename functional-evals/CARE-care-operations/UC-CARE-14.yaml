# Functional eval for UC-CARE-14, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-14
title: Answer ad-hoc workforce questions
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-14-answer-ad-hoc-workforce-questions.md
status: draft
primary_role: Head of People
process_style: guided
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Parse the question into metrics, entities and a period
  by: worker
- n: 2
  step: Resolve homes, regions and roles, including aliases, to canonical IDs
  by: worker
- n: 3
  step: Check the scope against the asker's access
  by: worker
- n: 4
  step: Calculate through the governed path, using a snapshot for past periods
  by: worker
- n: 5
  step: Answer with the scope, period, definition version, freshness and any caveats
  by: worker
policies:
  P1:
    rule: Every figure comes through the governed definitions in K1 and the dashboard's calculation path. A metric
      with no governed definition gets no figure, and missing data is reported as unavailable, never as zero.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: Answers give facts, not causes. They don't label or rank employees, and don't advise on probation, absence,
      disciplinary or termination decisions, which stay with the people named in K4.
    protects:
    - person
    - legal
    override: null
