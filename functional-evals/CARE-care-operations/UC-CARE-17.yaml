# Functional eval for UC-CARE-17, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-17
title: Detect and route workforce data-quality issues
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-17-detect-and-route-workforce-data-quality-issues.md
status: draft
primary_role: Head of People
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Retrieve employee records and confirm retrieval is complete
  by: worker
- n: 2
  step: Run the required-field and mapping checks
  by: worker
- n: 3
  step: Map each issue to the workforce metrics it affects
  by: worker
- n: 4
  step: Add or update a queue item for each issue and assign its owner
  by: worker (A2 only)
- n: 5
  step: Read back each item and mark recurring patterns
  by: worker (A2 only)
- n: 6
  step: Notify each owner of their newly assigned items
  by: worker (A2 only)
policies:
  P1:
    rule: Every check reports passed, failed (with the records) or not run; a check that couldn't run is never reported
      as passed. A metric affected by an open issue is never presented as clean.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: Queue items are never dismissed or deleted. An item closes only as Resolved, with the run that cleared
      it, once its issue no longer appears in the HR system.
    protects:
    - data
    override: null
