# Functional eval for UC-CARE-06, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-06
title: Route a reported incident's notifications and follow-on actions
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-06-route-a-reported-incidents-notifications-and-follow-on-actions.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Read the incident and resolve its home, region, category and severity
  by: worker
- n: 2
  step: Work out the required notifications, forms, deadlines and approvers
  by: worker
- n: 3
  step: Check what has already been notified for this incident
  by: worker
- n: 4
  step: Draft each notification from the recorded facts
  by: 'A0: — · A1, A3: worker'
- n: 5
  step: Send the routine internal notifications
  by: 'A1: human approves · A3: worker'
- n: 6
  step: Hold each sensitive or regulatory notification for its approver, with the deadline
  by: human (approver in K4)
- n: 7
  step: Log every notification and surface open actions
  by: worker
policies:
  P1:
    rule: The worker never sends a notification on the sensitive and regulatory list (K3), such as to Ofsted, the
      LADO, the police, parents or guardians about safeguarding or serious injury, or any external notice about
      staff conduct. It drafts it and holds it for the approver in K4.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: The worker never places an emergency call itself. For a missing child or anyone in immediate danger, it
      tells the RM at once that a person must call the emergency services now, and records who made the call and
      when.
    protects:
    - person
    - legal
    override: null
  P3:
    rule: Notifications state only the recorded facts of the incident. They give no cause, blame or judgement about
      a young person or a member of staff, and include only the details each recipient may see (K7).
    protects:
    - person
    - legal
    - data
    override: null
  P4:
    rule: Every held notification carries its deadline from K2, and is escalated along K4 at the lead time in K3
      if it is still unapproved. It is never left to lapse.
    protects:
    - person
    - legal
    override: null
