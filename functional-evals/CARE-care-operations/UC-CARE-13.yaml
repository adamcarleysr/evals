# Functional eval for UC-CARE-13, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-13
title: Monitor the workforce from the Head of People dashboard
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-13-monitor-the-workforce-from-the-head-of-people-dashboard.md
status: draft
primary_role: Head of People
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Open the pinned view with the viewer's saved layout and filters
  by: worker
- n: 2
  step: Apply the viewer's access scope
  by: worker
- n: 3
  step: 'Load the tiles from the governed calculation path: retention, absence, starters and leavers, probation,
    length of service, data quality'
  by: worker
- n: 4
  step: Apply the filters and breakdowns the viewer chooses
  by: worker
- n: 5
  step: Check freshness and label stale tiles and connector failures
  by: worker
- n: 6
  step: Drill from any total to the employees behind it
  by: worker
policies:
  P1:
    rule: Every tile, filter, drill-down and chat answer uses the governed definitions in K1, so the same question
      gives the same number for the same scope. No tile computes its own version of a metric.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: A tile older than the warning threshold in K3, or whose last refresh failed, shows its last refresh time
      and is never presented as current.
    protects:
    - data
    - customer reputation
    override: null
