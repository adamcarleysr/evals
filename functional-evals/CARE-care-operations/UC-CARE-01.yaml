      12/10/2026 by support worker Jo Baker; emergency plumbing; Brookside Plumbing quoted £180, booked Thursday
      15/10/2026 14:00–16:00; completion reported 15/10/2026 16:10; invoice £180. RM Megan Hart; RI Graham Okoye.
      Open case MC-0415 at Willow Lodge. K4: recurrence = 2 or more cases of the same category at the home within
      90 days, told to the RM and RI; safety reinspection within 7 days.'
  input:
