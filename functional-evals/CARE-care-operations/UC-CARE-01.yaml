# Functional eval for UC-CARE-01, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-01
title: Run a maintenance case from report to closure
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-01-run-a-maintenance-case-from-report-to-closure.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Log the reported issue and check for an open case for the same issue
  by: worker
- n: 2
  step: Hand the case to triage and record the result
  by: worker
- n: 3
  step: Hand the case to contractor contact and booking, and record each outcome
  by: 'A1: human · A2: worker'
- n: 4
  step: Move the stage on each event and read it back
  by: 'A1: human · A2: worker'
- n: 5
  step: Present the case for sign-off against the closure checklist
  by: worker
- n: 6
  step: Sign off the work
  by: human
- n: 7
  step: Close the case and raise the follow-on actions
  by: worker
policies:
  P1:
    rule: A case is closed only on a recorded sign-off by someone K3 allows to sign it off. The worker never closes
      a case, or marks it signed off, on anyone's say-so.
    protects:
    - person
    - legal
    - money
    override: the policy-override holder in K3 may bypass the gate with a logged justification
  P2:
    rule: An invoice that does not match the quote is not put forward as matching. The variance is shown, and the
      closure checklist is not met until the signer records an explanation for it.
    protects:
    - money
    override: null
  P3:
    rule: A recurrence flag lists only the matching cases (home, category, dates). It gives no cause and makes no
      judgement about residents, staff or the contractor.
    protects:
    - person
    - customer reputation
    override: null
scenarios:
