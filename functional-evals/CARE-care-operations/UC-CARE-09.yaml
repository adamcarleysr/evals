# Functional eval for UC-CARE-09, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-09
title: Confirm staff availability for an open shift
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-09-confirm-staff-availability-for-an-open-shift.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Confirm the shift is approved for contact and the contact's number is verified
  by: 'A1: human confirms · A3: worker'
- n: 2
  step: Call and confirm identity
  by: worker
- n: 3
  step: Run the availability script
  by: worker
- n: 4
  step: Handle no answer, voicemail, screening and retries
  by: worker
- n: 5
  step: Judge whether the call was reliable
  by: worker
- n: 6
  step: Record the transcript and outcome
  by: 'A1: human reviews · A3: worker (reliable calls only)'
- n: 7
  step: Hand an available contact to the RM to allocate the shift
  by: human
policies:
  P1:
    rule: No shift, home or case detail is given until the person confirms they are the contact. Voicemail and gatekeeper
      messages carry the callback number only.
    protects:
    - person
    - data
    override: null
  P2:
    rule: A contact is called only within the attempt limits in K2. A deliberate hang-up ends contact for that shift,
      and "take me off your list" ends all contact and goes to a person.
    protects:
    - person
    - customer reputation
    override: null
  P3:
    rule: A safeguarding, conduct or wellbeing disclosure on the call is recorded as said and routed to the RM at
      once. The voice agent makes no judgement about the person, on the call or in the record.
    protects:
    - person
    - legal
    override: null
