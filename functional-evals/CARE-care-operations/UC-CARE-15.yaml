# Functional eval for UC-CARE-15, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-15
title: Chase managers for due probation reviews
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-15-chase-managers-for-due-probation-reviews.md
status: draft
primary_role: Head of People
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Derive each probationer's review dates and state
  by: worker
- n: 2
  step: Check stop conditions per review
  by: worker
- n: 3
  step: Check cadence and the next reminder per review
  by: worker
- n: 4
  step: Resolve the recipients for each reminder
  by: worker
- n: 5
  step: Draft one reminder per review
  by: worker
- n: 6
  step: Approve and send
  by: 'A1: human · A3: worker'
- n: 7
  step: Record the reminder and the next reminder date
  by: worker
policies:
  P1:
    rule: The pass, extend or exit decision is always a person's. The worker gives dates, states and reminders only;
      it never recommends an outcome, records one, or says how a review should go.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: Remind only at the cadence points in K2, stop as soon as an outcome is recorded or the employee leaves,
      and after the final notice escalate rather than remind again.
    protects:
    - person
    - customer reputation
    override: null
  P3:
    rule: A reminder goes to the review owner and copies in K3 only. A reminder about a manager's own probation
      never goes to that manager.
    protects:
    - person
    - data
    override: null
