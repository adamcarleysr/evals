# Functional eval for UC-CARE-12, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-12
title: Produce the weekly and monthly People pack
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-12-produce-the-weekly-and-monthly-people-pack.md
status: draft
primary_role: Head of People
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Take one validated metrics run for the period and the open data-quality items
  by: worker
- n: 2
  step: Check the run is complete and home figures reconcile to totals
  by: worker
- n: 3
  step: Assemble the sections with deltas, and write the factual commentary with data-quality caveats
  by: worker
- n: 4
  step: Classify the content and check each recipient against the list and their tier
  by: worker
- n: 5
  step: Sign off and send
  by: 'A1: human · A3: worker'
- n: 6
  step: Log the send, hold or block and snapshot the pack version
  by: worker
policies:
  P1:
    rule: A pack whose HR refresh failed, whose data is past the block threshold in K4, or that fails a completeness
      or reconciliation check is not distributed, and its figures are never adjusted to make it pass.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: Commentary states only what the figures show, with data-quality caveats. It gives no causes and makes
      no judgement about any person.
    protects:
    - person
    - customer reputation
    override: null
  P3:
    rule: Each cadence's pack goes only to that cadence's recipient list in K1, and a recipient listed for a home-level
      extract gets only their own home's extract.
    protects:
    - data
    - customer reputation
    override: — ⚠ verify who approves list changes
  P4:
    rule: Content above a recipient's maximum tier in K3 (such as named starters and leavers or individual Bradford
      Factor triggers) is never sent to them without approval.
    protects:
    - person
    - legal
    - data
    override: the export approver in K3 approves the named recipient and purpose; the decision is logged
