  by: worker
- n: 6
  step: Approve and send
  by: 'A1: human · A3: worker'
- n: 7
  step: Log what was sent
  by: worker
policies:
  P1:
    rule: Spend that went ahead without the approval its tier required under K1 is shown as an exception with its
      case. It is never left out, re-labelled or folded into a total without comment.
    protects:
    - money
    - legal
    override: null
  P2:
    rule: Each home's report goes only to the recipients K2 sets for that home.
    protects:
    - data
    - customer reputation
    override: a change to the recipients is approved by the person K2 names and logged
  P3:
    rule: Notes state only what the figures show. They give no causes and make no judgements about staff, residents
      or contractors.
    protects:
    - person
    - customer reputation
    override: null
