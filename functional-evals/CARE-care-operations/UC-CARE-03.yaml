# Functional eval for UC-CARE-03, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-03
title: Get a contractor's quote and availability by phone
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-03-get-a-contractors-quote-and-availability-by-phone.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Check the case is approved for contact and the contractor has a verified number
  by: worker
- n: 2
  step: Prepare the call script and any chase email
  by: worker
- n: 3
  step: Confirm the contact before calling
  by: 'A1: human · A3: worker'
- n: 4
  step: Call and confirm identity
  by: worker
- n: 5
  step: Run the contractor script and capture the answers
  by: worker
- n: 6
  step: Handle no answer, voicemail, screening and hang-ups
  by: worker
- n: 7
  step: Judge the call's reliability and record the outcome
  by: worker
- n: 8
  step: Hand a captured quote and time to booking
  by: 'A1: human · A3: worker'
policies:
  P1:
    rule: No case detail is given until the contact has confirmed who they are. Voicemail and gatekeeper messages
      carry the callback number only.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: Call a contact only within the retry rules and maximum in K2. A deliberate hang-up is not retried, and
      a request to be taken off the list stops all calls to that contact and goes to a person.
    protects:
    - person
    - customer reputation
    override: null
  P3:
    rule: The call never agrees a price or a booking. A quote is captured as stated and checked under UC-CARE-04;
      a quote above the K4 limit is flagged as needing approval.
    protects:
    - money
    override: null
  P4:
    rule: An unreliable call (identity unconfirmed, poor audio, confused contact or partial answers) is reviewed
      by a person before anything from it is written to the case.
    protects:
    - data
    override: null
