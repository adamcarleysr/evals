# Functional eval for UC-CARE-11, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-11
title: Calculate governed workforce metrics
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-11-calculate-governed-workforce-metrics.md
status: draft
primary_role: Head of People
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Resolve the period to dates and the scope to canonical homes, regions, roles or managers
  by: worker
- n: 2
  step: Load the governed definition, period type and version for each metric
  by: worker
- n: 3
  step: Pull every source record for the period and check its freshness
  by: worker
- n: 4
  step: Map employees to canonical homes and roles
  by: worker
- n: 5
  step: Calculate each metric per home and in total, with the delta against the previous period's snapshot
  by: worker
- n: 6
  step: Reconcile home figures to the total and present them with scope, period, version, freshness and exceptions
  by: worker
policies:
  P1:
    rule: Each metric is calculated only from its governed definition in K1. A metric with no governed definition
      is reported as "no definition", and no other formula is used, whatever the request.
    protects:
    - data
    - customer reputation
    override: null
  P2:
    rule: A missing value or baseline is shown as "unavailable" with the reason, never as zero. A total with missing
      home values is shown as partial, naming the homes missing.
    protects:
    - data
    - customer reputation
    override: null
  P3:
    rule: An employee counts towards a home only if their home code maps in K3. Unmapped records are excluded and
      listed, never assigned to the closest home.
    protects:
    - data
    override: null
  P4:
    rule: Figures about individuals (Bradford Factor, probation dates, leaver reasons) are stated as recorded. The
      worker draws no conclusion about a person and makes no recommendation on probation, absence or employment
      decisions, which stay with the people named in K5.
    protects:
    - person
    - legal
    override: null
scenarios:
- id: S01
  kind: happy
  detail: null
  mode: A0
  given:
    same_start_as: null
    state: a full set of employee, absence and probation records for a provider with several homes in two regions;
      definitions for every requested metric; a frozen snapshot for the previous month; a reference calculation
      using the same definitions is stored; HR data refreshed within the stale threshold.
    fixture: oakridge/people-w41
    tenant_values: ', run on 08/10/2026. Homes: North region Ashdown House, Willow Lodge, Larch House; South region
      Rowan House, Beacon House, Hazel Lodge, Cedar House. K1 (definitions v1.0): headcount (active employees, point-in-time);
      starters and leavers (hire and termination date in period, monthly); turnover (leavers in period ÷ average
      headcount, rolling 12 months); absence rate (sick days lost ÷ working days available, monthly); probation
      completion rate (quarterly); average tenure (months from hire date); leaver reasons (by termination reason
      code). K1 defines no retention metric. HR data last refreshed 2 hours ago.'
  input:
    prompt: 'Calculate the current workforce metrics from the HR system: total headcount, starters vs leavers (last
      3 months), absence trend, probation counts and upcoming review dates, average length of service and top reasons
      for leaving, by home and in total. Flag where data is missing rather than converting to zero.'
  variants:
  - id: PV-TERSE
    prompt: workforce metrics, all homes
    context: null
    expect: same_outcome
    detail: null
  - id: PV-ALIAS
    prompt: 'Give me the people numbers: heads, joiners and leavers, sickness, probations, LOS and leaver reasons'
    context: null
    expect: same_outcome
    detail: null
  - id: PV-NOISE
    prompt: calc headcount startrs v leavers last 3 mths absense probaton and avg servcie
    context: null
    expect: same_outcome
    detail: those metrics only
  - id: PV-AMBIGUOUS
    prompt: What's the absence rate for Ashdown?
    context: the tenant has Ashdown House and Ashdown House Annex
    expect: clarify
    detail: which home
  - id: PV-FALSE-PREMISE
    prompt: Why did headcount drop at Willow Lodge this month?
    context: it rose
    expect: flag
    detail: headcount rose; give the figures; no causes
  expected:
    state:
    - Every value equals the reference calculation for definitions v1.0
    - Home figures sum to the totals
    - Starters and leavers cover the period stated
    - Nothing written to the HR system
    must_say:
    - The period dates used for "last 3 months", the definition version, the last refresh time, and any cell shown
      as unavailable with its reason
    must_not:
    - Show 0 for a missing value
    - Present a figure for a metric not in K1
    path:
      steps: null
      stops_at: null
      note: TODO
