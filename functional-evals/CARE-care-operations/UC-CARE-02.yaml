# Functional eval for UC-CARE-02, generated from the use case. Draft: pending sign-off.
use_case: UC-CARE-02
title: Triage a reported maintenance issue
use_case_version: '0.1'
source: verticals/CARE-care-operations/UC-CARE-02-triage-a-reported-maintenance-issue.md
status: draft
primary_role: Registered Manager
process_style: prescribed
tenant: Oakridge Care Group
scoring:
  repeat_runs: null
  latency_budget_seconds: null
reference_steps:
- n: 1
  step: Read the reported issue on the case
  by: worker
- n: 2
  step: Check the issue against the safety-critical conditions
  by: worker
- n: 3
  step: Classify the job category and severity
  by: worker
- n: 4
  step: Set the route, the people to contact and the response deadline
  by: worker
- n: 5
  step: Send the notifications
  by: 'A1: human · A3: worker'
- n: 6
  step: Record the classification and reason on the case
  by: worker
policies:
  P1:
    rule: An issue that meets a safety-critical condition in K4 goes at once to the named person in K4, before any
      other step, and is never queued for routine contractor contact.
    protects:
    - person
    - legal
    override: null
  P2:
    rule: Triage never approves spend, sets an approval tier or picks a contractor. It routes the case; spend and
      booking are decided under UC-CARE-04.
    protects:
    - money
    override: null
  P3:
    rule: Only the Registered Manager classifies a job as an urgent safety risk (which raises the spend limits).
      The worker may propose it, with the reason, but does not record it.
    protects:
    - money
    - person
    override: null
