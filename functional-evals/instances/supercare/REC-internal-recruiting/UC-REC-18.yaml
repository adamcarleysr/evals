  - "S01: Joshua Woodman's Norwood placement moved one week later between the two snapshots"
  - "S01: no removals at Norwood between the two snapshots"
  - "S01: a stored reference change set"
  - "S03: no forecast snapshot saved for the week five weeks before the run"
  - "S04: a placement in both snapshots with changed start date and home, and a status the comparison rules don't cover"
  - "S05: eight consecutive weekly forecast snapshots"
  - "S05: a home with a starter target, below it in each of the last 4 snapshots"
