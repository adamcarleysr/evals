# SuperCare binding for UC-REC-18 (eval v0.2). Values checked against ClickUp. Draft.
# Dates are not bound: the runner computes them at run time.
instance: SuperCare
eval: UC-REC-18
eval_version: "0.2"

values:
  candidate_name: Joshua Woodman
  candidate_home: Norwood
  added_home: Frimley
  removal_home: Phoenix
  home_change_from: Hyde Gardens
  home_change_to: Heroes Haven
  gap_home: "<to supply>"
  unmapped_status: "<to supply>"

  forecast_horizon_weeks: 4
